name: Evaluation code
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r evaluation/requirements.txt
      - name: Test an isolated public package
        run: python -B evaluation/tests/run_public.py
