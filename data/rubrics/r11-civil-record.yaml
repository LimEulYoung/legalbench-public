  scope:
  - 175점 소장. 2022.1.14. 한 건의 공동소송으로 제기하고 예비적·선택적 병합은 하지 않는다.
  - 의뢰인의 희망에 따른 승소 가능한 최대 범위를 청구하며 상대방의 타당한 항변을 청구범위에 반영한다. 최판기에 대해서는 금전청구를 하지 않는다.
  - 증명방법·첨부서류·별지 목록은 작성하지 않고 기록의 사실과 문서 성립을 다투지 않는다.
  grading_rules:
  - 항목별 조건을 충족한 가장 높은 점수 하나를 부여한다. 명시된 점수 단계와 허용 답안의 상한을 적용하고 임의의 중간점수는 만들지 않는다.
  - 논증은 답안 전체에서 찾되 사실과 법리의 연결이 드러나야 한다. 관련 사실이나 쟁점명만 언급한 것을 법적 판단까지 한 것으로 추정하지 않는다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 논거를 보충하여 점수를 주지 않는다. 교재의 문구·분량·판례번호·논증 순서 자체는 요구하지 않는다.
  - 시험 기준시점과 기록의 작성 지시를 적용한다. 기록의 가상 법령과 명시된 경과규정이 우선한다.
  - 명시된 허용 대안은 조건을 충족하면 그대로 평가하고, 조건에 없는 합리적 대안만 검토 대상으로 남긴다.
  - 당사자 표시는 이름으로 식별되면 된다. 주소의 사소한 오기는 당사자·관할을 잘못 정한 경우에만 해당 항목에서 평가한다.
  - 원금·이율·기산점은 구별한다. 앞선 계산 오류를 일관되게 청구취지로 옮긴 경우 해당 항목의 중복 감점 방지 조건을 따른다.
  - 보존등기 말소와 진정명의회복 이전등기는 명시된 조건을 충족하면 같은 점수로 인정한다. 두 청구를 동시에 요구하지 않는다.
  - 확정판결의 연 15%는 그 판결 내용을 적용한다. 새 금전청구의 소장 송달 다음 날 연 12%와 혼동하지 않는다.
  - 양수채권과 상계에서는 양도통지의 채무자·제3자 대항요건, 상계적상일과 의사표시일을 구별한다.
