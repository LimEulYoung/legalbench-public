      - points: 4
        criterion: 김경위가 전하는 김갑동의 자백은 제316조 제1항의 전문진술이며, 동의 없는 밤샘조사와 압박 정황 때문에 특신상태가 인정되지 않아 증거능력이 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 김경위 진술의 증거능력 부정 결론만 있다.
          2: 김경위의 법정 자백 전달 진술을 대상으로 특신상태·임의성 요건 또는 밤샘조사 사정 중 하나를 설명했다.
          3: 김경위의 법정 전달 진술을 특신상태·임의성 문제로 배제했으나 동의 없는 밤샘조사와 압박 정황의 적용이 불충분하다.
          4: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 제309조·제317조에 따른 원진술의 임의성 의심과 검사의 의문 해소 실패를 같은 사실로 설명하고 김경위의 법정 전달 진술을 배제하는 대안도 4점이다. 밤샘조사라는 단어만으로
          자동 배제하지 않는다. 경찰 피의자신문조서만 검토하고 법정 전달 진술의 증거능력은 판단하지 않았다면 이 항목은 0점이다.
        accept_label: 허용 답안
        id: K-I-1-b
      - points: 3
