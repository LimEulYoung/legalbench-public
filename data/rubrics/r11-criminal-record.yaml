        criterion: 김갑동의 경찰 제2회 피의자신문조서는 본인이 내용을 부인하므로 형사소송법 제312조 제3항에 따라 증거능력이 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
