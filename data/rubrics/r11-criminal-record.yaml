          3: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 이을녀 발언 자체를 비진술증거로 보고 바깥의 김갑동 진술에 제316조 제1항을 적용하는 구성도 인정한다. 이 경우 특신상태를 별도로 검토하고 박목격은 김갑동이 살해했다고 인정한
