  scope:
  - Ⅰ 김갑동 변론요지서 45점, Ⅱ 이을녀 객관적 검토의견서 55점. 지정된 본문만 평가하고 정상관계·공소사실 요지·인적 사항은 제외한다.
  - 2021.11.30. 공소제기 사건이다. 기록의 부칙에 따라 검사 피의자신문조서는 2022.1.1. 개정 시행 전 규정을 적용한다.
  - 김갑동의 사기미수는 지정된 작성 범위 밖이다. 두 서면 사이의 명시적 인용을 허용한다.
  grading_rules:
  - 항목별 조건을 충족한 가장 높은 점수 하나를 부여한다. 명시된 점수 단계와 허용 답안의 상한을 적용하고 임의의 중간점수는 만들지 않는다.
  - 논증은 답안 전체에서 찾되 사실과 법리의 연결이 드러나야 한다. 관련 사실이나 쟁점명만 언급한 것을 법적 판단까지 한 것으로 추정하지 않는다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 논거를 보충하여 점수를 주지 않는다. 교재의 문구·분량·판례번호·논증 순서 자체는 요구하지 않는다.
  - 시험 기준시점과 기록의 작성 지시를 적용한다. 기록의 가상 법령과 명시된 경과규정이 우선한다.
  - 명시된 허용 대안은 조건을 충족하면 그대로 평가하고, 조건에 없는 합리적 대안만 검토 대상으로 남긴다.
  - 증거능력과 증명력을 구별한다. 증거목록의 동의·내용 인정은 피고인별로 확인하고 한 피고인의 증거의견을 다른 피고인에게 옮기지 않는다.
  - 김갑동의 변론은 유리한 사유를, 이을녀의 검토의견은 유죄 가능성을 포함한 객관적 결론을 평가한다.
  - 시행 전 기소된 검사 조서를 내용부인만으로 배제하지 않는다. 생략된 서류나 적법성에 새로운 하자를 만들지 않는다.
  - 무죄의 전단·후단은 항목의 허용 범위를 따른다. 논거가 옳다면 숫자·호의 단순 오기만으로 별도 감점을 만들지 않는다.
  id: r11-criminal
