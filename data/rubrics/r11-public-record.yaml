  scope:
  - '행정소장 50점: ① 피고, ② 청구취지, ③ 대상적격·피고적격·협의의 소의 이익, ④ 절차상 하자를 제외한 위법성만 작성한다.'
  - '헌법소원 50점: ① 청구취지, ② 자기관련성·현재성·청구기간, ③ 위헌 이유만 작성한다. 청구취지의 개정연혁은 제외한다.'
  - 기록의 가상 법령을 우선하고 의뢰인을 위한 취소·위헌 논증을 작성한다. 공공기관운영법·계약사무규칙 자체의 위헌·위법과 처분의 무효 여부는 작성 범위에서 제외한다.
  grading_rules:
  - 항목별 조건을 충족한 가장 높은 점수 하나를 부여한다. 명시된 점수 단계와 허용 답안의 상한을 적용하고 임의의 중간점수는 만들지 않는다.
  - 논증은 답안 전체에서 찾되 사실과 법리의 연결이 드러나야 한다. 관련 사실이나 쟁점명만 언급한 것을 법적 판단까지 한 것으로 추정하지 않는다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 논거를 보충하여 점수를 주지 않는다. 교재의 문구·분량·판례번호·논증 순서 자체는 요구하지 않는다.
  - 시험 기준시점과 기록의 작성 지시를 적용한다. 기록의 가상 법령과 명시된 경과규정이 우선한다.
  - 명시된 허용 대안은 조건을 충족하면 그대로 평가하고, 조건에 없는 합리적 대안만 검토 대상으로 남긴다.
  - 이미 인쇄된 인적 사항·법원·제출일과 작성 제외 사항에 별도 점수나 감점을 만들지 않는다.
  - 합리적인 위헌 주장을 평가한다. 실제 게임법 판결의 합헌 결론을 그대로 옮기는 과제가 아니며, 목적·수단의 판단과 평등 심사기준은 항목의 허용 범위를 따른다.
  - 보충 주장인 주의·감독 면책과 감경을 구별한다. 면책을 정확히 주장한 답안에 감경 주장을 추가로 요구하지 않는 항목의 허용 조건을 적용한다.
  id: r11-public
