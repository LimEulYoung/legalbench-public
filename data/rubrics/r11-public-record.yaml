  - id: P-I-2
    title: ③ 소의 적법성
    points: 14
    expected: 두 제재를 처분으로 인정하고 공단의 피고적격 및 제한기간 만료 후에도 남는 소의 이익을 설명한다.
    sections:
    - title: ③ 소의 적법성
      points: 14
      items:
      - points: 4
        criterion: 입찰제한의 처분 여부는 통지 내용·과정과 상대방의 예측가능성으로 판단하며, 법령·계약을 함께 인용했어도 사전통지와 행정쟁송 안내 등을 종합하면 법령에 따른 처분이라고
          설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 입찰제한이 처분이라는 결론만 있다.
          2: 판단 법리를 설명하거나 통지·절차의 구체적 사실을 들어 처분성을 인정했다.
          3: 판단 법리와 구체적 사실을 연결했으나 계약상 조치와 구별하지 않았다.
          4: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        id: P-I-2-a
      - points: 4
        criterion: 공급자등록취소와 10년 등록제한은 공단 입찰 참가를 직접 막아 법적 지위에 영향을 주므로 처분이며, 근거가 내부지침이라는 사정은 본안의 적법성 문제와 구별한다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 처분이라는 결론만 있다.
          2: 입찰 참가 제한이라는 효과로 처분성을 설명했지만 취소·제한 중 하나만 다루었다.
          3: 두 조치의 권리 제한을 설명했으나 내부지침의 효력과 처분성을 구별하지 않았다.
          4: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        id: P-I-2-b
      - points: 2
        criterion: 공단은 법령에 따라 행정권한을 부여받아 자기 명의로 처분한 공공기관이므로 공단 자체에 피고적격이 있고, 이사장은 대표자라고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 처분청이 피고라는 법리 또는 공단의 피고적격 결론만 있다.
          2: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        id: P-I-2-c
      - points: 4
        criterion: 입찰제한은 제소 당시 존속하고 2022.1.25. 만료 후에도 2년 내 재위반 시 가중제재의 위험이 남아 소의 이익이 있으며, 공급자 제재도 취소하면 입찰 참가 지위를
          회복한다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 소의 이익이 있다는 결론만 있다.
          2: 입찰제한 종료 후 가중제재 위험과 소의 이익을 연결했다.
          3: 가중제재 위험을 설명하고 제소 당시 존속 또는 공급자 지위 회복 중 하나를 설명했다.
          4: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 가중처분기준의 법규성에 대한 특정 견해나 정확한 가중 비율은 요구하지 않는다.
        accept_label: 허용 답안
        id: P-I-2-d
    reference_sections:
    - Ⅰ. 행정소장 / ③ 소의 적법성
  - id: P-I-3
    title: ④ 입찰제한의 위법성
    points: 19
    expected: 명백한 경쟁·계약 이행 침해 요건, 직원 감독에 따른 제재 제외, 감경 및 비례 위반을 구체적 사실로 주장한다.
    sections:
    - title: ④ 입찰제한의 위법성
      points: 19
      items:
      - points: 3
        criterion: 공공기관운영법 제39조 제2항과 계약사무규칙 제15조의 명백한 공정경쟁·적정이행 침해 요건은 금품 제공 사실만으로 충족되는 것이 아니라고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 처분사유가 없다는 결론만 있다.
          2: 명백한 경쟁·계약 이행 침해 요건을 제시했으나 금품 제공만으로 부족하다는 구별이 없다.
          3: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        id: P-I-3-a
      - points: 4
        criterion: 계약 후 50만 원 상품권 제공, 수령자가 납품 감독·검사를 담당하지 않음, 개인 자금과 수령자의 요구 등의 사실을 연결하여 공정경쟁·적정이행 침해가 명백하지 않다고
          논증한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 관련 사실을 열거했으나 명백한 침해 요건과 연결하지 않았다.
          2: 구체적 사실 한 가지를 명백한 침해 부정에 연결했다.
          3: 감독·검사 권한이 없는 사실을 포함해 두 가지를 연결했다.
          4: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 만점은 감독·검사 권한 부재를 포함한 세 가지 이상의 구체적 사정을 요건과 연결한 경우이다. 형사상 뇌물죄 불성립을 반드시 주장할 필요는 없다.
        accept_label: 허용 답안
        id: P-I-3-b
      - points: 4
        criterion: 주기적 청렴교육·미팅 일지·상호 점검·준법감시인 등 상당한 주의·감독을 근거로 국가계약법 시행령 제76조 제3항 단서의 제재 제외를 주장하거나, 같은 사실을 감경·재량
          불행사의 구체적 근거로 충분히 논증한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 회사에 잘못이 적다는 주장만 있다.
          2: 주의·감독의 구체적 사실 한 가지를 제재 제외 또는 감경과 연결했다.
          3: 두 가지 구체적 감독 사실을 법적 효과와 연결했다.
          4: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 만점은 세 가지 이상의 감독 사실과 제재 제외 또는 감경 논증을 갖춘 경우이다. 시행령 단서를 정확히 적용한 경우 감경 경로를 추가로 요구하지 않는다.
        accept_label: 허용 답안
        id: P-I-3-c
      - points: 5
        criterion: 법령이 제재·기간 결정에 재량을 주고 위반 동기·횟수에 따라 감경할 수 있는데도, 첫 위반·소액·직원의 개인 제공·회사의 감독 등 사정을 고려하지 않은 3개월 제재는
          재량 불행사 또는 일탈·남용이라고 주장한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 재량 일탈·남용이라는 결론만 있다.
          3: 감경 가능성과 구체적 참작사유를 연결했으나 기계적 3개월 제재의 문제를 설명하지 않았다.
          5: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: P-I-3-c에서 상당한 주의·감독에 따른 제재 제외 법리와 구체적 사실을 모두 갖추어 제재 자체를 배제했다면 이 보충적 감경 항목도 5점으로 인정한다. 감독 사실 열거만으로는
          이 대안을 적용하지 않는다.
        accept_label: 허용 답안
        id: P-I-3-d
      - points: 3
        criterion: 첫 위반·소액·회사의 감독과 공단 거래 의존 등 사익을 공정한 계약 이행의 공익과 비교하여 3개월 입찰제한이 과중하다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 가혹하거나 비례원칙에 반한다는 결론만 있다.
          2: 구체적 불이익을 들었으나 공익과의 비교가 없다.
          3: 평가기준의 법리·사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        id: P-I-3-e
    reference_sections:
    - Ⅰ. 행정소장 / ④ 처분의 위법성 / 1. 입찰참가자격제한
  - id: P-I-4
