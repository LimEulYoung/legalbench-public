      points: 32
      items:
      - id: C-4-a
        points: 4
        criterion: 별지 제2 부동산에 관한 최병철·박이채 사이의 2022. 10. 15. 대물변제약정을 수익자 박이채와 전득자 최상진에 대한 관계에서 취소해 달라고 청구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 사해행위취소를 구하지만 대상 법률행위를 특정하지 않음.
          2: 대물변제약정은 특정하나 날짜·부동산에 오류가 있거나 뒤의 박이채·최상진 매매까지 별도로 취소함.
          3: 대물변제 취소 대상은 정확하나 전득자에 대한 취소·회복의 관계가 불명확함.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 청구취지 전체에서 두 피고에 대하여 같은 대물변제의 취소와 말소를 구함이 명확하면 원고와 각 피고 사이에서라는 문구를 반복하지 않아도 된다.
        accept_label: 허용 답안
