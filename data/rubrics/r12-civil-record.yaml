          3: 두 액수는 맞으나 각각의 기간·이율 근거가 부족함.
          4: 두 금액을 근거와 함께 계산하지만 별도 연대보증채무의 이행기 당일이라는 점을 반영했는지 불분명함.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
