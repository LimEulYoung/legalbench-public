  - id: C-2
    title: 곡성리 무효등기의 말소와 승낙
    points: 30
    expected: 상속인들과 이민국을 순차 대위하여 정진선·은행의 등기를 이민국에게 말소하고 박성연의 승낙을 구한다.
    sections:
    - title: 곡성리 무효등기의 말소와 승낙
      points: 30
      items:
