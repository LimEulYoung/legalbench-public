          5: 배분 법리와 계산을 모두 적용하나 부동산별 소유자 또는 채무관계 특정이 불완전함.
          6: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 부동산 시가에 단순 비례 안분하거나 건물에서 채무 4억 원 전액을 공제하여 책임재산이 없다고 보면 만점이 아니다.
        accept_label: 허용 답안
      - id: C-4-f
        points: 4
        criterion: 채무초과 상태의 최병철이 유일한 건물을 특정 채권자 박이채에게 8,000만 원 채무의 대물변제로 넘겨 일반채권자의 공동담보를 줄인 행위가 사해행위라고 설명한다.
