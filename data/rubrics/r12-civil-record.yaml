  grading_rules:
  - 항목별 조건을 충족한 가장 높은 점수 하나를 부여한다. 명시된 점수 단계와 허용 답안의 상한을 적용하고 임의의 중간점수는 만들지 않는다.
  - 논증은 답안 전체에서 찾되 그 사실과 법리의 연결이 답안에 드러나야 한다. 관련 사실·죄명·쟁점명만 언급한 것을 법적 판단까지 한 것으로 추정하지 않는다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 논거를 보충하여 점수를 주지 않는다. 교재의 문구·분량·판례번호·논증 순서 자체는 요구하지 않는다.
  - 시험 기준시점과 기록의 작성 지시를 적용한다. 기록의 가상 법령이 다른 현행 법령보다 우선한다.
  - 명시된 허용 대안은 조건을 충족하면 그대로 평가하고, 조건에 없는 합리적 대안만 검토 대상으로 남긴다.
  - 청구취지는 상대방·수령자·목적물·등기·금액·기산일·조건을 평가하며 청구원인의 법리와 사실 적용은 별도로 평가한다. 정답 금액을 써도 그 계산 논증이 없으면 계산 항목의 만점으로 보지 않는다.
  - 한 건의 공동소송을 작성한다. 예비적·선택적 병합, 진정명의회복 형태의 등기청구, 이자·지연손해금·차임에 대한 추가 지연손해금은 하지 않는다.
  - 김창수의 1985년 매매를 청구 근거로 삼지 않는다. 상속인에 대한 철거·수거·인도, 이철진·이철수에 대한 금전청구, 확정 지급명령이 있는 최병철·안현숙에 대한 금전청구는 포함하지 않는다.
  - 앞서 설명한 상속관계·피보전채권 등을 후속 청구에서 명확히 원용하면 반복 기재를 요구하지 않는다. 특정 사실을 인용한 것과 대위요건을 충족한다고 판단한 것은 구별한다.
  - 사건관계인의 법률적 주장과 계산은 사실로 확정된 것이 아니다. 계약·등기·영수증에 따라 판단한다. 날짜의 공휴일 여부는 고려하지 않는다.
  - 장정자에 대한 수원 토지 청구 제외는 C-4-i에서만 평가한다. 청구하지 않는 이유를 소장에 따로 적지 않아도 해당 조건에 따라 인정한다.
