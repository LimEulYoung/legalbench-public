  - id: C-4
    title: 역삼동 사해행위취소·원상회복과 수원 토지 제외
    points: 32
    expected: 역삼동 건물에 관한 최병철·박이채의 대물변제약정을 취소하고 수익자와 악의 전득자의 각 등기를 최병철에게 말소한다. 수원 토지는 제척기간 경과로 청구하지 않는다.
