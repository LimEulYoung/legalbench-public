          1: 제척기간을 언급하지만 수원 토지에 관한 취소 또는 가액배상을 청구함.
          2: 청구에서는 제외했지만 가처분으로 제척기간이 중단된다는 등 모순된 이유를 적음.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 청구에서 제외하고 이에 모순되는 주장이 없으면 이유를 소장에 별도로 쓰지 않아도 3점이다. 가처분은 취소소송 제기의 1년 제척기간을 중단하거나 준수하는 수단이 아니다.
        accept_label: 허용 답안
