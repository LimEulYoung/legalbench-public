        points: 6
        criterion: 공동저당의 주채무자는 장정자이고 최병철은 물상보증인임을 구별한다. 물상보증인의 변제자대위를 고려하여 장정자 토지 3억 원이 피담보채무 4억 원을 먼저 부담하고 잔액 1억
