  grading_rules:
  - 항목별 조건을 충족한 가장 높은 점수 하나를 부여한다. 명시된 점수 단계와 허용 답안의 상한을 적용하고 임의의 중간점수는 만들지 않는다.
  - 논증은 답안 전체에서 찾되 그 사실과 법리의 연결이 답안에 드러나야 한다. 관련 사실·죄명·쟁점명만 언급한 것을 법적 판단까지 한 것으로 추정하지 않는다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 논거를 보충하여 점수를 주지 않는다. 교재의 문구·분량·판례번호·논증 순서 자체는 요구하지 않는다.
  - 시험 기준시점과 기록의 작성 지시를 적용한다. 기록의 가상 법령이 다른 현행 법령보다 우선한다.
  - 명시된 허용 대안은 조건을 충족하면 그대로 평가하고, 조건에 없는 합리적 대안만 검토 대상으로 남긴다.
  - 김갑동에게 유리한 변론과 이을남에 대한 객관적 검토를 구별한다. 김갑동의 유죄 부분 정상변론만 평가하며, 공소사실 요지·이을남 정상관계·뇌물공여·서면 외형은 평가하지 않는다.
  - 2023. 1. 11. 기준 법령을 적용한다. 검사 조서에는 2020. 2. 4. 개정 제312조 제1항을 적용하며 이후 친족상도례·형사소송법 변경을 소급하여 채점하지 않는다.
  - 증거의견은 해당 피고인과 해당 진술 부분별로 구별한다. 증거능력 배척과 신빙성 탄핵은 독립 평가하되, 동일한 탄핵 사정을 표현만 바꾸어 여러 사정으로 세지 않는다.
  - 기록에서 적법하게 존재한다고 정한 서명·절차를 임의로 부정하지 않는다. 전화 진술을 수사관이 정리한 수사보고서는 일반 진술조서와 구별한다.
  - 특수폭행 입증 부족과 포함된 폭행의 소송조건 흠결을 구별하고 최종 판결은 공소기각으로 정리한다. 포괄일죄 일부 증명 부족의 이유무죄를 별개 죄의 주문무죄와 혼동하지 않는다.
