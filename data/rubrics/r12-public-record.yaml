documents:
- id: P-I
  title: 행정소장
  points: 50
  issues:
  - id: P-I-1
    title: ①·②·⑤·⑥ 피고·청구취지·제출일·관할
    points: 10
    expected: 보건복지부장관에게 2022.4.20. 직위해제와 2022.5.13. 감봉 3월의 취소 및 소송비용 부담을 구한다. 제출일은 2022.9.8., 법원은 대전지방법원이다.
    sections:
    - title: ①·②·⑤·⑥ 피고·청구취지·제출일·관할
      points: 10
      items:
      - id: P-I-1-a
        points: 2
        criterion: 피고를 보건복지부장관으로 표시한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 보건복지부로 적어 처분기관은 식별되지만 장관을 피고로 특정하지 않았다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-1-b
        points: 2
        criterion: 2022.4.20.자 직위해제처분의 취소를 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 직위해제 취소를 구하지만 처분일을 생략하거나 잘못 적었다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-1-c
        points: 2
        criterion: 2022.5.13.자 감봉 3월의 처분을 취소해 달라고 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 징계의 취소는 구하나 처분일을 6.13. 등으로 쓰거나 변경 전 정직 3월만을 대상으로 삼았다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 2022.5.13.자 정직처분 중 감봉 3월로 감경되어 남은 부분을 취소한다는 동등한 표현도 인정한다.
        accept_label: 허용 답안
      - id: P-I-1-d
        points: 1
        criterion: 소송비용을 피고가 부담하도록 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-1-e
        points: 1
        criterion: 소장 작성일을 두 처분에 공통되는 마지막 날인 2022.9.8.로 기재한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: P-I-2-f에서 기산사실·적용기간·공동 제출 종기를 정하는 법리는 맞지만 날짜의 단순 계산오류로 감점했고, 그 계산값을 작성일에 일관되게 옮겼다면 이 항목은 1점으로 인정한다.
          기산사실이나 적용기간을 잘못 정한 경우, 두 기간 중 늦은 날을 택한 경우, 날짜를 누락하거나 본문 계산과 모순되게 적은 경우에는 이 예외를 적용하지 않는다.
        accept_label: 중복 감점 방지
      - id: P-I-1-f
        points: 2
        criterion: 행정소송법 제9조 제1항에 따라 세종 소재 피고를 관할하는 대전지방법원을 제출법원으로 정한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 대전지방법원만 맞게 기재하거나, 피고 소재지 관할 법리는 맞지만 법원명을 잘못 정했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 관할의 근거는 소의 적법성 등 답안의 다른 부분에서 설명해도 된다. 서울행정법원은 제9조 제2항에 따른 선택관할이므로 문제의 지정 조건에는 맞지 않는다.
        accept_label: 허용 답안
