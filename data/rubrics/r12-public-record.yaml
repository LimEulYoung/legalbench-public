  - id: P-I-2
    title: ③ 소의 적법성
    points: 14
    expected: 직위해제와 감경된 원징계처분의 처분성·소의 이익을 인정하고 적법한 소청 및 2022.9.8. 제소기간을 설명한다.
    sections:
    - title: ③ 소의 적법성
      points: 14
      items:
      - id: P-I-2-a
        points: 2
        criterion: 직위해제는 징계와 구별되는 잠정적 보직해제지만 보수 등 법적 지위에 영향을 주는 처분이며, 기각재결 후에도 원처분이 소송대상이라고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 직위해제가 처분이라는 결론만 있거나 그 법적 효과 또는 원처분과 재결의 구별을 빠뜨렸다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-b
        points: 3
        criterion: 감경은 당초 처분을 유리하게 변경하여 존속시키므로 재결이나 6.13. 변경처분이 아니라 5.13. 감봉 3월로 남은 원처분을 다툰다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 원처분주의라는 법리 또는 올바른 대상만 제시했다.
          2: 원처분주의와 감경된 원처분을 연결했으나 변경처분과의 차이를 설명하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-c
        points: 3
        criterion: 복직으로 직위해제가 실효되어도 과거 감액된 봉급을 회복할 수 있어 취소를 구할 법률상 이익이 남는다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 복직 후에도 소의 이익이 있다는 결론만 있다.
          2: 보수상 불이익의 회복을 설명했으나 효력 소멸과 과거 효과의 존속을 연결하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 기록의 봉급 50% 지급을 근거로 한다. 정확한 비율 자체는 필수어가 아니지만, 실제 기간에 적용되지 않는 3개월 경과 후 봉급 30%만을 근거로 삼으면 2점 이하이다.
        accept_label: 허용 답안
      - id: P-I-2-d
        points: 1
        criterion: 감봉의 취소로 감액된 보수를 회복할 수 있어 소의 이익이 있다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-e
        points: 2
        criterion: 국가공무원법상 필요적 소청전치와 각 통지일 4.22.·5.16.부터 30일 이내인 5.18. 소청 및 6.8. 결정을 연결하여 전심절차 준수를 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 필요적 소청전치 또는 실제 소청을 거쳤다는 사실 한쪽만 설명하거나, 두 처분의 30일 내 청구 여부를 모두 적용하지 않았다. 전치 법리와 실제 소청·결정을 함께 설명했더라도 청구기간
            적용이 빠지면 1점이다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-f
        points: 3
        criterion: 6.10. 소청결정 송달 다음 날부터 90일을 계산하여 두 처분 모두 2022.9.8.이 제소 최종일이라고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 90일이라는 기간 또는 9.8.이라는 결론만 맞다.
          2: 재결서 송달을 기산점으로 두 처분에 90일을 적용했으나 말일 계산이 틀리거나, 올바른 날짜는 쓰되 한 처분에만 적용했다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 6.14. 감경 통지일로 다시 계산하지 않는다. 1년의 객관적 기간도 충족한다는 추가 설명은 가능하나 별도 필수점수를 두지 않는다.
        accept_label: 허용 답안
    reference_sections:
    - Ⅰ. 행정소장 / ③ 이 사건 소의 적법성
  - id: P-I-3
    title: ④ 직위해제의 실체적 위법
    points: 6
    expected: 직위해제는 재량행위이며 기소만으로 자동 처분할 수 없다. 유죄의 고도 개연성과 직무상 위험을 심사하지 않은 재량 일탈·남용이다.
    sections:
    - title: ④ 직위해제의 실체적 위법
      points: 6
      items:
      - id: P-I-3-a
        points: 2
        criterion: 직위를 부여하지 않을 수 있다는 규정과 잠정적 예방 목적에 따라 직위해제를 재량행위로 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 재량행위라는 결론만 있다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-3-b
        points: 4
        criterion: 무죄추정·직위해제 목적에 비추어 기소만으로 정당화되지 않고 유죄의 고도 개연성·공정한 직무수행의 위험을 구체적으로 고려해야 함을 설명하여 이 사건의 기계적인 직위해제가
          위법하다고 논증한다.
