  guidelines: data/grading-rules.md
  scope:
  - Ⅰ 행정소장 50점. ①~⑥만 작성하며 적법성에서 원고·피고적격은 제외한다. 두 처분에 공통되는 제소기간 최종일과 행정소송법 제9조 제1항의 관할을 쓴다.
  - Ⅱ 헌법소원심판청구서 50점. ①~⑤만 작성하며 대상적격·변호사강제주의와 조항 개정연혁은 제외한다. 법령상 청구 최종일을 쓴다.
  - 가상 법령과 기록 사실을 우선한다. 헌법소원은 관련 헌재 결정이 없었다는 가정하에 의뢰인을 위한 합리적 위헌 주장을 작성한다. 명확성 주장은 소송전략상 제외한다.
  grading_rules:
  - 항목별 조건을 충족한 가장 높은 점수 하나를 부여한다. 명시된 점수 단계와 허용 답안의 상한을 적용하고 임의의 중간점수는 만들지 않는다.
  - 논증은 답안 전체에서 찾되 그 사실과 법리의 연결이 답안에 드러나야 한다. 관련 사실·죄명·쟁점명만 언급한 것을 법적 판단까지 한 것으로 추정하지 않는다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 논거를 보충하여 점수를 주지 않는다. 교재의 문구·분량·판례번호·논증 순서 자체는 요구하지 않는다.
  - 시험 기준시점과 기록의 작성 지시를 적용한다. 기록의 가상 법령이 다른 현행 법령보다 우선한다.
  - 명시된 허용 대안은 조건을 충족하면 그대로 평가하고, 조건에 없는 합리적 대안만 검토 대상으로 남긴다.
  - 행정소장 50점과 헌법소원심판청구서 50점으로 평가한다. 기재가 이미 인쇄된 원고·대리인과 작성 제외 사항·경어체에 별도 감점을 만들지 않는다.
  - 직위해제의 절차상 하자, 징계의 사전통지·출석·심문·진술 하자를 만들어 내지 않는다. 기록에 징계의결서가 있으므로 징계의결을 하지 않았다고 전제하지 않는다.
  - 제출일 기재와 기간 계산 논증을 구별한다. 논증에서 한 계산 오류를 그대로 날짜란에 옮긴 경우 명시된 이월 인정을 적용한다.
  - 약사법은 실제 판결의 결론을 복원하는 과제가 아니다. 약사와 비약사의 입장을 함께 고려한 위헌 논증을 평가하고, 평등심사의 허용된 두 구성은 중복 요구하지 않는다.
