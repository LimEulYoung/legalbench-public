        accept: 임희영·김명석을 피고로 추가하면 필요한 피고 수에 따라 정한 점수에서 2점을 상한으로 한다. 경진아를 추가한 오류는 C-5-g에서 평가하고 이 항목에서는 다시 감점하지 않는다.
          피고를 단순히 나열했는지와 개별 청구가 맞는지는 각각 평가한다.
