  - id: C-1
    title: 강유수 — 철거·인도·부당이득
    points: 32
    expected: 지분을 상실한 강유수에게 건물철거·대지 전부 인도 및 2022.5.16.부터 월 300만 원을 구한다. 소수지분·사용승낙·관습상 지상권·선의점유 항변은 배척한다.
    sections:
    - title: 강유수 — 철거·인도·부당이득
      points: 32
      items:
      - id: C-1-a
        points: 5
        criterion: 강유수에게 별지 제2항 건물철거와 제1항 토지 전부의 원고에 대한 인도를 구하고, 건물 소유자인 강유수에게 별도 퇴거를 구하지 않는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 철거·인도 대신 퇴거만 구한다.
          3: 철거와 인도 중 하나만 구하거나 토지 인도를 1/2에 한정한다. 또는 철거·인도는 맞지만 별도 퇴거를 함께 구한다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-1-b
        points: 4
        criterion: 강유수에게 2022.5.16.부터 토지 인도완료일까지 월 300만 원의 지급을 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 임료 상당액 지급을 구했지만 월 300만 원과 올바른 지급기간을 특정하지 못했다.
          2: 월 300만 원만 맞거나, 월액은 틀려도 시작일과 종료시점이 모두 맞다.
          3: 금액과 시작일·종료시점 중 하나가 맞다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 종료시점을 건물철거 완료일로 삼는 나눔의 구성도 4점 인정한다. 기록에는 철거 후 별도의 토지 점유가 제시되지 않았다. 소장 송달일부터만 청구하면 이전 기간을 포기하므로 3점이
          상한이다.
