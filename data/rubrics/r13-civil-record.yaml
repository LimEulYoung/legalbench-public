          구제수단이 있고 목적·범위·원인이 본문에 정확히 연결되면 같은 내용을 모두 반복할 필요는 없다. 지료는 임의로 만들지 않는다.
        accept_label: 허용 답안
      - id: C-6-b
        points: 5
        criterion: 사해행위취소와 건물 등기말소는 상대적 회복일 뿐 김병수가 실체적 소유권을 취득하지 않으므로, 건물 압류 당시에도 토지·건물 소유자가 김연제로 동일하다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 소유자 동일이라는 결론만 있다.
          2: 취소의 상대적 효력이라는 법리만 설명하고 이 사건 소유관계와 연결하지 않았다.
          3: 김연제 소유의 계속은 설명했으나 압류 시점의 동일인 소유에 연결하지 않았다.
          4: 기준시점과 동일인 소유를 설명하나 등기말소가 곧 김병수의 실체적 소유 회복이라는 모순된 판단도 함께 유지한다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 등기말소 사실만 적거나, 그로 인해 김병수가 실체법상 소유권을 회복했다고만 설명하면 0점이다.
        accept_label: 허용 답안
      - id: C-6-c
        points: 3
        criterion: 2023.5.1. 경매대금 완납으로 원고가 건물을 취득하여 소유자가 분리되고 철거특약도 없으므로 지상권을 등기 없이 취득한다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 경매로 지상권을 취득했다는 결론만 있다.
          2: 경매에 따른 분리·철거특약 부재·등기 불요 중 하나를 빠뜨렸다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-6-d
        points: 4
        criterion: 김연제가 철거·인도를 요구하여 현재의 토지 사용권이 불안하므로 지상권 확인으로 해결할 이익이 있고, 지상권 때문에 철거·인도 요구를 거절할 수 있다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 확인의 이익 또는 철거 거절 결론만 있다.
          2: 현재의 불안과 구제 필요를 설명했으나 실제 철거·인도 요구에 적용하지 않았다.
          3: 확인 필요를 기록에 적용하나 철거·인도 거절 효과를 설명하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 설정등기청구를 택하면 현재의 권리 다툼을 등기로 해소할 필요 및 토지소유자의 등기의무·철거청구 배척을 설명하여 4점을 받을 수 있다. 등기 없이 취득한다는 이유만으로 등기청구가
          불가능하다고 보지 않는다.
        accept_label: 허용 답안
