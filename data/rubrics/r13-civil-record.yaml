  scope:
  - 소장 작성·제출일은 2024.1.12.이다. 관할 있는 법원 한 곳에 공동소송으로 제기하며 다른 공동소송 요건은 충족된 것으로 본다.
  - 의뢰인 목표에 맞추어 승소 가능한 최대 범위로 청구한다. 예비적·선택적 병합, 임희영·김명석에 대한 청구는 하지 않는다.
  - 이자·임료 상당액에 대한 지연손해금은 고려하지 않는다. 증명방법·첨부서류·별지목록은 작성하지 않는다.
  grading_rules:
  - 항목별 조건을 충족한 가장 높은 점수 하나를 부여한다. 명시된 점수 단계와 허용 답안의 상한을 적용하고 임의의 중간점수는 만들지 않는다.
  - 논증은 답안 전체에서 찾되 그 사실과 법리의 연결이 답안에 드러나야 한다. 관련 사실·죄명·쟁점명만 언급한 것을 법적 판단까지 한 것으로 추정하지 않는다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 논거를 보충하여 점수를 주지 않는다. 교재의 문구·분량·판례번호·논증 순서 자체는 요구하지 않는다.
  - 시험 기준시점과 기록의 작성 지시를 적용한다. 기록의 가상 법령이 다른 현행 법령보다 우선한다.
  - 명시된 허용 대안은 조건을 충족하면 그대로 평가하고, 조건에 없는 합리적 대안만 검토 대상으로 남긴다.
  - 청구취지는 금액·목적물·수령자·구제수단으로 평가하고, 해당 청구원인의 법리·사실 적용은 별도로 평가한다.
  - 거제동은 법정지상권 존재확인 또는 요건을 갖춘 설정등기청구를 인정한다. 두 청구를 예비적·선택적으로 병합할 필요는 없다.
  - 정릉동 건축 시점은 기록 안에서 2015년경과 2021.9.10.으로 다르게 나타난다. 어느 날짜를 택했는지 자체로 감점하지 않고 공유토지의 법리 등 명시된 경로로 판단한다.
  - 경진아에 대한 제2 전부금은 청구하지 않는다. 청구하지 않은 선택과 압류경합의 설명을 함께 평가한다.
