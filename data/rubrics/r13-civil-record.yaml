      - id: C-1-c
        points: 4
        criterion: 원고가 2022.5.16. 경매대금 완납으로 대지 1/2 지분을 취득했고, 강유수가 직접 지은 미등기 건물을 원시취득하여 대지 전체를 점유한다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 원고의 지분 소유 또는 피고의 건물 소유 사실만 적었다.
          2: 양쪽 소유·점유는 맞지만 대금 완납 또는 건물 원시취득의 근거를 빠뜨렸다.
          3: 취득 근거와 소유·점유를 설명했으나 완납일을 등기일인 5.18.로 잘못 정했다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-1-d
        points: 5
        criterion: 강유수는 이제 공유자가 아닌 무권원 제3자이므로 원고가 보존행위로 전부 인도를 구할 수 있고, 임희영의 승낙도 지분 상실 시 반환 조건 때문에 더 이상 점유권원이 되지
          않는다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 과반수가 아니어도 청구할 수 있다는 결론만 있다.
          2: 제3자에 대한 보존행위 법리 또는 사용승낙의 종료 중 하나만 설명했다.
          3: 두 법리를 제시했으나 지분 상실·조건부 승낙 사실에 연결하지 않았다.
          4: 보존행위를 사실에 적용했으나 사용승낙을 과반수 미달만으로 배척하여 당초 공유자 전원의 합의와 그 종료를 구별하지 않았다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-1-e
        points: 5
        criterion: 공유자 한 사람의 건물을 위해 그 지분 매각만으로 지상권을 인정하면 다른 공유자의 지분에도 처분효과를 강제하게 되므로 관습법상 법정지상권이 성립하지 않는다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 지상권 불성립이라는 결론만 있다.
          3: 동일인 소유 등 성립요건을 적었지만 다른 공유자의 지분 보호라는 이유를 이 사건에 적용하지 않았다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 기록상 2021.9.10. 건축 사실에 따라 압류일 2021.6.16.에는 건물이 존재하지 않았다고 논증하는 경로도 5점이다. 반대 자료가 있어 압류 후 건축 논거를 필수로
          요구하지 않으며 두 경로를 모두 쓸 필요도 없다.
        accept_label: 허용 답안
      - id: C-1-f
        points: 5
        criterion: 선의점유로 과실을 취득하려면 권원 오신에 정당한 근거가 필요함을 설명하고, 반환 조건 및 2022.5.16. 지분 상실 인식 등에 비추어 그날부터 무상 사용이익을 보유할
          근거가 없다고 반박한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 악의 또는 선의점유 아님이라는 결론만 있다.
          2: 권원 오신의 정당한 근거 법리만 제시했다.
          3: 소 제기 때부터 악의로 간주된다는 이유만 제시하거나, 권원이 없다는 사실만으로 선의 추정도 당연히 깨진다고 보았다.
          4: 정당한 근거의 부재를 구체적으로 설명하나 지분 상실일부터 적용된다는 판단이 없다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 법정지상권을 오인했더라도 무상 사용권을 믿을 정당한 근거가 없다는 논증을 인정한다. 선의 추정이 있다는 이유만으로 기록의 반환조건·상실 인식을 생략하면 만점이 아니다.
        accept_label: 허용 답안
      - id: C-1-g
        points: 4
        criterion: 나대지 임료 월 600만 원 중 원고 지분 1/2인 300만 원만 부당이득으로 반환받고, 점유권원을 다투며 반환을 거부하므로 장래의 지급도 미리 청구할 필요가 있다고
          설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 부당이득반환 또는 장래청구라는 명칭만 있다.
          2: 지분별 300만 원 산정 또는 장래이행 필요성 중 하나만 논증했다.
          3: 두 요소를 적었으나 나대지 기준 또는 계속 점유·반환 거부 사실과 연결하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
