documents:
- id: K-I
  title: 김갑동에 대한 검토의견서
  points: 50
  issues:
  - id: K-I-1
    title: 뇌물수수 — 공소시효
    points: 8
    expected: 7년 공소시효가 기소 전에 완성되었고 대향범인 공여자 기소는 시효를 정지시키지 않아 면소한다.
    sections:
    - title: 뇌물수수 — 공소시효
      points: 8
      items:
      - id: K-I-1-a
        points: 3
        criterion: 뇌물수수죄의 장기 5년을 기초로 공소시효 7년을 적용하여 2016. 11. 25. 범행의 시효가 2023. 11. 30. 기소 전에 완성되었다고 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 공소시효가 완성되었다는 결론만 맞음.
          2: 7년의 시효와 기소 전 완성을 맞게 판단하였으나 법정형에 관한 설명이 없음.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 완성일 2023. 11. 24.을 따로 계산하지 않아도 7년이 경과한 뒤 기소되었음을 정확히 설명하면 만점이다.
        accept_label: 허용 답안
      - id: K-I-1-b
        points: 3
        criterion: 수수자와 공여자는 별개의 구성요건을 실현하는 대향범이므로 형사소송법 제253조 제2항의 공범이 아니며, 이을남의 공소제기부터 확정까지도 김갑동의 시효는 정지되지 않는다고
          설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 대향범임만 밝힘.
          2: 대향범에 대한 기소로 시효가 정지되지 않는다고 판단하였으나 별개 구성요건·공범 규정 배제의 이유가 없음.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-1-c
        points: 2
        criterion: 공소시효 완성을 이유로 면소판결을 해야 한다고 명확히 결론 낸다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 시효 때문에 처벌할 수 없다고만 하여 판결 종류가 불명확함.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 면소와 시효 완성의 연결이 있으면 조문 번호를 쓰지 않아도 만점이다.
        accept_label: 허용 답안
    reference_sections:
    - Ⅰ. 김갑동에 대한 검토의견서 / 1. 뇌물수수
  - id: K-I-2
    title: 도주치상 — 구호·축소사실·소추조건
    points: 18
    expected: 도주치상 불성립. 부득이한 중앙선 침범과 음주 예외를 검토한 뒤 기본적으로 기소 전 처벌불원에 따른 공소기각을 한다. 명시된 조건의 유죄 대안도 인정한다.
    sections:
    - title: 도주치상 — 구호·축소사실·소추조건
      points: 18
      items:
      - id: K-I-2-a
        points: 3
        criterion: 실제 구호 필요와 도주 의사를 판단하고, 병원 권유·피해자의 선이탈 및 경미한 피해를 근거로 도주치상이 성립하지 않는다고 논증한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 구호 필요성 또는 도주 의사를 법적 쟁점으로만 제시함.
          2: 도주치상 불성립을 맞게 판단하고 관련 사실 한 종류만 연결함.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-2-b
        points: 3
        criterion: 나피해의 법정진술을 나목격의 병원 권유 목격, CCTV의 팔을 붙잡는 장면 등과 비교하여 신빙성이 부족하다고 평가한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 나피해 진술이 신빙성이 없다고만 함.
          2: 병원 권유에 관한 목격진술 또는 CCTV 중 하나와 대조하여 신빙성을 판단함.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 경찰진술과의 차이 또는 합의금 불만도 보충 근거가 된다. 객관적 자료와의 대조 없이 악감정만 주장하면 1점이다.
        accept_label: 허용 답안
      - id: K-I-2-c
        points: 3
        criterion: 단서 제2호의 중앙선 침범은 부득이한 사유 없는 침범을 뜻한다고 설명하고, 택시 급제동·빗길·거리와 전문가 의견 등을 연결하여 이 사건에 적용하지 않는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 부득이한 중앙선 침범에는 예외가 적용되지 않는다는 법리만 맞음.
          2: 불가피한 회피와 중앙선 예외 배제를 연결하나 이를 뒷받침할 구체적 기록 근거가 부족함.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-2-d
        points: 3
        criterion: 단순 음주운전 성립과 단서 제8호 적용을 구별하여, 음주 여부와 무관하게 회피가 어려웠다는 전문가 의견 등을 근거로 음주로 인한 사고라는 연결을 부정한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 단서 제8호 적용 여부를 법적 쟁점으로 밝힘.
          2: 음주와 사고의 관련성을 검토하여 예외 적용 여부를 결론 내리나 전문가 의견과의 관계를 설명하지 못함.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: '유죄 대안도 3점: 단서 제8호를 적용하되, 전문가 의견은 택시와의 충돌 회피에 한정되어 보행자 충격의 과실까지 배제하지 않는다는 등 그 의견에도 불구하고 예외를 적용할
          이유를 구체적으로 제시한다. 혈중알코올농도만으로 예외를 단정하면 1점이다.'
        accept_label: 허용 답안
      - id: K-I-2-e
        points: 3
        criterion: 2020. 1. 10. 경찰에서 표시한 처벌불원은 기소 전의 유효한 의사표시이며 합의금 불만에 따른 법정 번복으로 철회할 수 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 피해자의 처벌불원 사실만 식별함.
          2: 처벌불원 번복이 무효라고 판단하나 최초 표시의 기소 전 시점 또는 수사기관에 대한 표시를 빠뜨림.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 단서 제8호의 유죄 대안에서는 처벌불원과 번복 사실을 검토하고 반의사불벌 특례가 배제되어 소추를 막지 못한다고 설명하면 3점이다.
        accept_label: 허용 답안
      - id: K-I-2-f
        points: 3
        criterion: 도주치상에 포함된 교통사고처리특례법 위반을 방어권 불이익 없이 공소장변경 없이 판단할 수 있음을 밝히고, 기소 전 처벌불원에 따른 공소기각을 최종 판결로 제시한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 도주치상이 성립하지 않더라도 포함된 과실치상죄로 판단할 수 있음을 밝힘.
          2: 축소사실을 검토하고 공소기각을 맞게 제시하나 직권 판단 가능성 설명이 없거나 도주 무죄와 공소기각을 별도 주문처럼 제시함.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: K-I-2-d의 구체적 이유를 갖춘 유죄 대안도 공소장변경 없는 판단 가능성과 방어권을 설명하고 축소사실 유죄로 결론 내리면 3점이다. 도주치상의 구성요건인 과실을 검토한
          것만으로 축소사실의 독립 판단을 인정하지 않는다. 중앙선 예외 배제만으로 과실치상죄 자체도 성립하지 않는다고 단정하지 않는다.
        accept_label: 허용 답안
    reference_sections:
    - Ⅰ. 김갑동에 대한 검토의견서 / 2. 도주치상과 포함된 교통사고처리특례법 위반
  - id: K-I-3
    title: 음주운전 — 가벼운 신법 적용
    points: 8
    expected: 개인형 이동장치에 관한 제156조 제11호의 가벼운 신법으로 유죄를 인정한다.
    sections:
    - title: 음주운전 — 가벼운 신법 적용
      points: 8
      items:
      - id: K-I-3-a
        points: 3
        criterion: 형벌법규 자체가 가볍게 바뀌고 별도 경과규정이 없으므로 형법 제1조 제2항에 따라 신법을 적용하며 반성적 고려 여부를 요구하지 않는다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 가벼운 신법 적용 원칙만 제시함.
          2: 신법 적용과 경과규정 부재를 설명하나 반성적 고려의 불요를 설명하지 않음.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-3-b
        points: 3
        criterion: 이 전동킥보드가 개정법상 개인형 이동장치에 해당하여 제148조의2에서 제외되고 제156조 제11호의 자전거등 음주운전으로 처벌된다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 전동킥보드에 신법이 적용된다고만 함.
          2: 개인형 이동장치와 가벼운 자전거등 음주운전 규정의 적용을 설명하나 종전 조항에서 제외되는 관계가 불명확함.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 조문 번호 없이도 종전 자동차등 벌칙에서 제외되어 자전거등 벌칙으로 바뀐다는 내용이 정확하면 만점이다.
        accept_label: 허용 답안
      - id: K-I-3-c
        points: 2
