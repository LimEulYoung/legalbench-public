  - id: P-I-3
    title: ⑥ 수리처분의 무효
    points: 14
    expected: 특별결의 없는 유일한 영업의 양도는 무효이고 이를 전제로 한 신고수리도 무효이다. 서류상 위조 의심을 확인하지 않은 하자는 중대·명백하다.
    sections:
    - title: ⑥ 수리처분의 무효
      points: 14
      items:
      - id: P-I-3-a
        points: 4
        criterion: 유일한 영업의 전부 양도에는 주주총회 특별결의가 필요한데 이를 거치지 않아 강행규정 위반으로 양도가 무효라고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 양도 무효라는 결론만 있다.
          2: 특별결의 필요와 결의 부재는 설명하나 영업 전부 양도 또는 강행규정 위반의 효과와 연결하지 않았다.
          3: 유일한 영업 양도·특별결의 부재·무효를 연결했으나 간이영업양도 예외가 적용되지 않는 이유가 없다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
