  - id: P-I-2
    title: ⑤ 소의 적법성
    points: 10
    expected: 수리를 요하는 신고의 수리는 지위 변동을 일으키는 처분이다. 기존 영업자에게 원고적격이 있고 무효확인에는 보충성이 요구되지 않는다. 확정판결 없이 다른 피고에 대한 국가배상청구를
      병합할 수 있다.
    sections:
    - title: ⑤ 소의 적법성
      points: 10
      items:
      - id: P-I-2-a
        points: 2
        criterion: 승계신고는 수리를 요하고, 수리가 종전 영업자의 지위 소멸과 양수인의 지위 취득을 가져오므로 처분이라고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 수리를 요하는 신고 또는 처분이라는 결론은 있으나 지위 변동의 근거가 없다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-b
        points: 2
        criterion: 오션은 기존 영업자 지위를 상실하는 직접 상대방이므로 무효확인을 구할 법률상 이익이 있다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 원고적격을 인정하나 직접 침해되는 영업자 지위와 연결하지 않았다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-c
        points: 1
        criterion: 무효확인소송의 피고는 처분청이고 이 사건에서는 속초시장이라고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-d
        points: 2
        criterion: 무효확인소송에는 보충성이 요구되지 않으므로 민사상 양도계약 무효확인소송을 먼저 거칠 필요가 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 보충성 불요 또는 선행 민사소송 불요 중 하나만 설명했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-e
        points: 3
        criterion: 국가배상청구는 수리처분과 원인을 같이하는 관련청구여서 다른 피고에 대하여도 사실심 변론종결 전 병합할 수 있고, 먼저 무효확인 인용판결이 확정될 필요는 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 관련청구 병합이 가능하다는 결론만 있다.
          2: 관련성 및 다른 피고에 대한 병합을 설명했으나 확정판결 불요를 빠뜨렸거나, 관련성과 확정판결 불요는 설명했으나 병합 범위를 빠뜨렸다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 제10조·제38조를 정확히 인용하거나 같은 규율 내용을 서술하면 된다. 개별 청구의 소송요건은 문제에서 갖춘 것으로 본다.
        accept_label: 허용 답안
    reference_sections:
