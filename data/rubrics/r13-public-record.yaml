          3: 구체 위험과 회복 곤란성을 연결했으나 청구인의 규모·준비 부담에 적용하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-II-1-d
        points: 2
        criterion: 2024.3.5. 시행까지 약 두 달밖에 남지 않고 기술 준비에 시간이 걸려 본안결정 전에 손해가 발생할 긴급성을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 시행 임박 또는 긴급성 결론만 있다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-II-1-e
        points: 4
        criterion: 인용 후 본안 기각의 불이익과 기각 후 본안 인용의 불이익을 비교하고, 아동 보호 지연의 공익상 부담을 고려하면서 신청인의 회복 곤란한 손해를 막기 위해 정지가 필요하다고
          논증한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 이익형량 필요 또는 인용 결론만 있다.
          2: 두 경우를 제시하고 신청인 손해를 논하나 정지에 따른 아동 보호의 불이익은 다루지 않았다.
          3: 양쪽 불이익을 구체적으로 비교했으나 왜 정지가 더 나은지 설명이 없다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 공익을 추상적·사소하다고만 표현하거나 정지기간의 보호 공백을 전혀 고려하지 않으면 2점이 상한이다. 공익을 덜 제한하는 정지 범위를 논증한 경우도 인정한다.
        accept_label: 허용 답안
