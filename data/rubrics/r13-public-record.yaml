    title: ①·② 효력정지 신청과 필요성
    points: 15
    expected: 제25조의 효력을 2024헌마16 종국결정까지 정지한다. 본안의 가능성, 회복 곤란한 손해, 시행 임박에 따른 긴급성 및 양방향 불이익을 비교한다.
    sections:
    - title: ①·② 효력정지 신청과 필요성
      points: 15
      items:
      - id: P-II-1-a
        points: 3
        criterion: 아동 성보호법 제25조의 효력을 헌법재판소 2024헌마16 사건의 종국결정 선고 시까지 정지하는 신청취지를 적는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 제25조에 대한 잠정 효력정지를 구하나 본안사건 특정과 종료시점이 모두 빠지거나 잘못되었다.
          2: 제25조 효력정지와 본안사건 특정·종료시점 중 하나가 정확하다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 문제의 신청서 양식에 본안사건 2024헌마16이 이미 표시되어 있으므로, 신청취지에서 '이 사건 본안' 등으로 그 사건을 명확히 가리키면 사건번호를 반복하지 않아도 인정한다.
          다른 사건번호를 명시하거나 본안사건이 불명확하면 해당 부분점수 조건을 적용한다. 정확한 부칙 제1조 중 제25조에 관한 부분을 함께 대상으로 삼아도 인정한다. 제25조가 명확히 특정되면
          법률번호·개정일의 생략은 감점하지 않는다.
