  scope:
  - Ⅰ 행정소장 50점. ①~⑧을 작성하며 적법성은 대상·원고·피고적격, 소의 이익, 관련청구 병합요건에 한정한다.
  - Ⅱ 가처분신청서 15점. 신청취지와 필요성만 작성하고 본안 사건번호는 2024헌마16이다.
  - Ⅲ 헌법소원심판청구서 35점. 청구취지·적법요건·위헌 이유를 쓰되 청구인능력·공권력행사성·권리보호이익은 제외한다.
  - 행정소송은 근거법령의 위헌·위법성을 주장하지 않는다. 헌법소원은 내부회의 전략에 따라 의뢰인에게 유리한 합리적 위헌 주장을 작성한다.
  grading_rules:
  - 항목별 조건을 충족한 가장 높은 점수 하나를 부여한다. 명시된 점수 단계와 허용 답안의 상한을 적용하고 임의의 중간점수는 만들지 않는다.
  - 논증은 답안 전체에서 찾되 그 사실과 법리의 연결이 답안에 드러나야 한다. 관련 사실·죄명·쟁점명만 언급한 것을 법적 판단까지 한 것으로 추정하지 않는다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 논거를 보충하여 점수를 주지 않는다. 교재의 문구·분량·판례번호·논증 순서 자체는 요구하지 않는다.
  - 시험 기준시점과 기록의 작성 지시를 적용한다. 기록의 가상 법령이 다른 현행 법령보다 우선한다.
  - 명시된 허용 대안은 조건을 충족하면 그대로 평가하고, 조건에 없는 합리적 대안만 검토 대상으로 남긴다.
  - 행정소장 50점, 가처분신청서 15점, 헌법소원심판청구서 35점으로 평가한다. 작성 제외 부분이나 문체에 관한 별도 감점은 만들지 않는다.
  - 국가배상은 자치사무·속초시 책임을 기본으로 한다. 명시된 조건을 갖춘 기관위임사무·대한민국과 속초시 공동책임 구성도 인정한다.
  - 실제 아동·청소년 성보호법의 합헌 결정과 가상 법률의 위헌 주장을 구별한다. 현실 법령의 면책사유·하위법령을 가상 법령에 있는 것으로 전제하지 않는다.
