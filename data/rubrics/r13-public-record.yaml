  - id: P-I-1
    title: ①~④·⑧ 당사자·청구취지·관할
    points: 16
    expected: 오션이 속초시장을 상대로 2022.12.29. 승계신고 수리의 무효확인을, 속초시를 상대로 일부 손해 500만 원과 2023.3.15.부터 5%·소장 송달 다음 날부터 12%를
      구한다. 관할은 춘천지방법원 강릉지원이다.
    sections:
    - title: ①~④·⑧ 당사자·청구취지·관할
      points: 16
      items:
      - id: P-I-1-a
        points: 2
        criterion: 원고를 주식회사 오션, 대표이사를 김정석으로 표시한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 회사 오션은 맞지만 대표이사를 누락하거나 나양도 등으로 잘못 기재했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-1-b
        points: 2
        criterion: 처분의 피고 속초시장과 국가배상의 피고 속초시를 구별하여 적는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 두 청구 중 하나의 피고만 맞다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 기관위임사무 구성에 맞추어 속초시장·대한민국(법무부장관 이민서)·속초시를 기재해도 2점이다. 피고란의 형식은 여기서, 사무귀속 논증은 P-I-4-a에서 평가한다.
        accept_label: 허용 답안
      - id: P-I-1-c
        points: 1
        criterion: 사건명을 영업자지위승계신고 수리처분 무효확인 등으로 표시한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-1-d
        points: 3
        criterion: 2022.12.29. 속초시장의 오션캐슬 영업자지위승계신고 수리처분에 대하여 무효확인을 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 해당 승계신고 수리처분을 다투지만 취소만 구한다.
          2: 수리처분의 무효확인을 구하나 처분일 또는 처분의 식별에 누락·오기가 있다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 나양도 또는 종전 영업자 오션을 상대방으로 표현하더라도 동일한 수리처분이 명확히 특정되면 3점이다.
        accept_label: 허용 답안
      - id: P-I-1-e
        points: 2
        criterion: 속초시에 영업손해 중 일부인 500만 원의 지급을 구하고 일부청구임을 밝힌다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 500만 원을 청구하지만 일부청구임을 밝히지 않거나, 일부청구임은 명시하나 금액을 잘못 적었다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 일부청구임은 청구원인에서 밝혀도 된다. 기관위임사무 구성에 따른 대한민국·속초시의 공동 지급 청구도 인정한다.
        accept_label: 허용 답안
      - id: P-I-1-f
        points: 2
        criterion: 500만 원에 대하여 2023.3.15.부터 소장 부본 송달일까지 연 5%, 그다음 날부터 완제일까지 연 12%를 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 두 구간 중 하나의 기산점·종료점·이율이 맞거나, 두 이율은 맞지만 구간을 잘못 나누었다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-1-g
        points: 1
        criterion: 소송비용의 피고 부담을 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-1-h
        points: 1
        criterion: 금전 지급 부분에 한하여 가집행을 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-1-i
        points: 2
        criterion: 제출법원을 춘천지방법원 강릉지원으로 정한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 행정소송법 제9조 제1항에 따른 피고 소재지 관할 원칙은 맞게 설명했으나 법원명을 잘못 정했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
