  scope:
  - 175점 소장. 2025.1.17.자 소장 하나를 작성한다. 공동소송의 나머지 요건은 충족된 것으로 보고 예비적·선택적 병합을 하지 않는다.
  - 의뢰인의 요청에 맞는 승소 가능한 범위를 청구한다. 오국한에 대한 대여금 청구는 하지 않는다.
  - 임료·임료 상당액·이자에 대한 지연손해금, 증명방법·첨부서류·별지 목록의 재작성은 제외한다.
  grading_rules:
  - 항목별 만점·부분점수 조건 중 충족한 가장 높은 점수 하나를 부여한다. 허용 답안과 명시된 상한을 함께 적용하고 임의의 점수 단계를 만들지 않는다.
  - 동일 쟁점의 논증은 답안 전체에서 찾아 인정한다. 교재의 문구·분량·판례번호나 논증 순서 자체를 요구하지 않는다.
  - 기록의 사실과 작성 지시를 전제로 하며, 시험 기준일 이후의 법령·판례를 요구하지 않는다. 문제의 가상 법령이 실제 법령보다 우선한다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 내용을 기준답안에서 가져와 작성한 것으로 인정하지 않는다.
  - 조건에 없는 합리적 대안은 검토 대상으로 남긴다. 미검토라는 이유로 이미 규정된 허용 답안의 점수를 낮추지 않는다.
  - 청구취지의 대상·금액·기간과 청구원인의 법리·사실 적용을 나누어 평가한다. 형식상 당사자 누락만으로 관련 실체 항목을 일괄 0점 처리하지 않는다.
  - 청구취지의 수치가 틀려도 청구원인의 법리와 계산이 옳으면 해당 논증 점수를 인정한다. 같은 문구의 반복은 요구하지 않는다.
  - 법률상 같은 이행을 구하는 표현은 인정한다. 공동하여·각자 등 표현보다 중복 수령하지 않는 부진정연대 관계를 평가한다.
  - 성수동의 선의 점유와 평택의 유치권 소멸을 구별한다. 청구 금액·기간은 기록의 사실과 해당 법리를 함께 적용하여 판단한다.
