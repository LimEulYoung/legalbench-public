    - title: 물품대금
      points: 30
      items:
      - id: C-1-a
        points: 4
        criterion: 강용원을 채권자로 하여 김선웅·오민한에게 공동하여 물품대금 2억 원을 지급하라는 청구취지를 적는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 한 피고에게만 2억 원을 청구하거나 두 피고에 대한 청구에서 금액·공동 책임 표시가 틀렸다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-1-b
        points: 4
        criterion: 2억 원에 대해 2021.11.6.부터 각 피고의 소장 부본 송달일까지 연 6%, 다음 날부터 완제일까지 연 12%를 청구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 지연손해금 청구는 있으나 이율과 기산점 모두 불완전하다.
          3: 6%→12%와 11.6. 기산·송달 다음 날 변경 중 하나를 완성했고 다른 하나에 오류·누락이 있다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 두 피고에 대해 소장 부본 송달일이라고 통합 기재하더라도 각자의 송달일을 뜻하면 인정한다.
        accept_label: 허용 답안
      - id: C-1-c
        points: 4
        criterion: 2021.6.5. 물품매매·납품과 미지급 2억 원을 적고, 지급기일이 없어 11.5. 이행청구에 따라 지체책임이 발생한다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 매매·납품·미지급 사실 또는 이행청구와 지체책임 중 하나만 설명했다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-1-d
        points: 5
        criterion: 자산·고객·고용관계를 포함한 영업양도와 해드림 상호속용에 상법 제42조를 적용해 오민한의 부진정연대책임을 설명하고, 내부 면책약정만 있고 지체 없는 면책등기·통지가 없으므로
          원고에게 대항할 수 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 상호속용 양수인도 책임진다는 법리만 썼다.
          3: 영업양도·상호속용에 공동 책임을 적용했으나 면책약정 항변을 다루지 않았다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 면책등기와 양도인·양수인의 통지는 별개의 법정 방법이다. 이 사건에서 유효한 면책 조치가 없다는 점을 설명하면 어느 방법부터 쓰든 인정한다.
        accept_label: 허용 답안
      - id: C-1-e
        points: 6
        criterion: 물품대금의 3년 시효가 기한 없는 채권을 행사할 수 있는 2021.6.5.부터 진행한다고 설명하고, 완성 전인 2024.5.6. 최고 도달 후 6개월 이내인 8.5.
          승인으로 최고 시점의 중단 효력이 유지된다고 적용한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 3년의 시효기간을 설명하거나, 최고·승인에 따른 시효중단의 법적 효과를 설명했지만 기산점과 날짜에 대한 적용이 부족하다.
          4: 3년 시효와 최고 후 6개월 내 승인에 따른 중단은 설명했으나 6.5. 기산·5.6. 도달·8.5. 승인 중 날짜 적용에 누락·오류가 있다.
          6: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 중단되어 시효가 완성되지 않았다는 논증을 평가한다. 시효중단이라는 용어 자체는 필수가 아니지만, 최고나 승인 때문에 시효의 진행 또는 완성 여부가 달라진다는 설명이 있어야
          한다. 이행각서를 작성했다거나 채무를 승인했다는 사실만으로 중단 효과를 설명한 것으로 보지 않는다. 최고 자체만으로 확정적 중단 또는 완성 후 승인만으로 당연한 포기를 인정하면 최대
          2점이다.
        accept_label: 허용 답안
      - id: C-1-f
        points: 7
        criterion: 승인은 영업양도 후라도 중단 효력이 생긴 최고는 2024.7.5. 양도 전이므로 양수인에게 그 효과가 미친다고 설명한다. 양도 후 양도인에게만 발생한 중단사유가 당연히
          양수인에게 미치는 것은 아니라는 구별을 한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 최고·승인에 따른 시효중단의 효과가 양수인 오민한에게도 미친다고 판단했으나, 양도 전후 시점과 그 이유를 설명하지 않았다.
          4: 5.6. 최고가 7.5. 영업양도 전이라는 사실은 들었으나 8.5. 승인과 소급되는 중단 효력을 연결하지 않았다.
          5: 양도 전 최고로 중단 효력이 미친다는 경로는 맞지만 양도 후 사유의 상대효와 구별하지 않았다.
          7: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 양수인에게도 지급책임이 있다거나 채권의 시효가 아직 완성되지 않았다는 설명만으로는 이 항목의 2점 조건을 충족하지 못한다. 최고·승인에 따른 시효중단 효과가 양수인에게도 미치는지에
          관한 판단을 답안에서 확인한다.
        accept_label: 채점 유의사항
