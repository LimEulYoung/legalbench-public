  - id: C-2
    title: 성수동 등기말소
    points: 30
    expected: 변제충당으로 3/5 지분의 담보채무가 경매개시 전 소멸한다. 이문호·은행의 등기를 그 지분 범위에서 말소.
    sections:
    - title: 성수동 등기말소
      points: 30
      items:
      - id: C-2-a
        points: 6
        criterion: 이문호의 소유권이전등기와 대한은행의 근저당권설정등기를 각각 3/5 지분에 한하여 말소하도록 청구하고, 2024.10.5. 접수 제25797호·제25799호로 등기를 특정한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
