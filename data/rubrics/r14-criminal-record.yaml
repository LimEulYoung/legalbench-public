          1: 단순폭행 해당성·반의사불벌·축소사실의 직권 판단 중 일부는 맞지만 나머지 설명이 빠졌다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 단순폭행과 반의사불벌을 모두 설명했어도, 공소장변경 없이 축소사실을 판단할 수 있는지와 방어권 불이익 여부를 검토하지 않았다면 1점이다.
