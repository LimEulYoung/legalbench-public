          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 완성된 위변조 문서를 스캔한 뒤 전송하면 행사죄가 될 수 있다는 반대 경우를 반드시 별도 예시로 적을 필요는 없다.
