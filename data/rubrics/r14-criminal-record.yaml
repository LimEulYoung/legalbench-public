  - id: K-II-3
    title: 3. 특수상해와 기판력
    points: 8
    expected: 동일한 다툼에서 이어진 흉기 휴대·사용의 기본적 사실관계 동일성을 주장하여 면소를 구한다. 피해자·행위 차이를 논증한 별개 범행과 정상변론 대안도 인정한다.
    sections:
    - title: 3. 특수상해와 기판력
      points: 8
      items:
      - id: K-II-3-a
        points: 2
        criterion: 같은 사건 경위의 특수협박미수에 대한 2024.10.31. 약식명령이 11.10. 확정되었고, 동일한 공소사실에 확정판결의 기판력이 미친다는 법리를 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 확정된 약식명령 또는 기판력 법리 중 하나만 썼다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-II-3-b
        points: 4
        criterion: 협박 대상 최주인과 상해 피해자 곽사장이 다름을 전제로, 같은 시각·장소의 다툼에서 칼을 들고 들어가려다 제지당하여 상해한 일련의 행위임을 들어 사회적 사실관계와 규범적
          요소상 동일성을 논증한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 시간·장소가 같아 동일하다는 결론만 썼다.
          2: 같은 다툼의 연속성을 설명했으나 피해자가 다름을 검토하지 않았다. 또는 피해자가 같다는 잘못된 전제에서 상상적 경합이라고 했다.
          3: 다른 피해자와 일련의 행위를 모두 설명했으나 수단·결과의 연결 또는 규범적 판단이 없다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 상상적 경합이라는 용어는 필수가 아니다. 대안으로, 기본적 사실관계 동일성에 관한 판례의 판단틀을 적시하고 협박 상대와 상해 피해자·보호법익이 다르며 제지를 계기로 새로운
          상해 고의가 형성되어 별개 행위라는 점을 구체적으로 논증하면 4점이다. 단순히 피해자가 다르다는 한마디만으로는 1점이다.
        accept_label: 허용 답안
      - id: K-II-3-c
        points: 2
        criterion: 동일성이 인정되므로 형사소송법 제326조 제1호의 면소를 구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 기판력이 미친다고 했지만 무죄·공소기각 등 다른 판결 형식을 썼다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: K-II-3-b의 별개 행위 대안을 충분히 논증한 답안은 유죄 가능성을 인정하고 자백·반성·우발적 경위 등 기록에 근거한 정상변론까지 하면 2점이다. 그 대안에서 정상변론이
          빠지면 1점이다. 면소 주장에 예비적 정상변론을 덧붙이는 것은 감점하지 않는다.
        accept_label: 허용 답안
