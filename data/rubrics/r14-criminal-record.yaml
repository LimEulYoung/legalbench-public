  - id: K-II-4
    title: 4. 범인도피교사
    points: 8
    expected: 사촌에게 은신처·휴대전화를 부탁한 통상적 도피는 방어권 남용이 아니어서 무죄.
    sections:
    - title: 4. 범인도피교사
      points: 8
      items:
      - id: K-II-4-a
        points: 3
        criterion: 자기 도피를 위한 통상적인 도움 요청은 처벌하지 않되, 허위 자백 유도 등 방어권을 남용하면 범인도피교사가 성립할 수 있다는 판례의 구별을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 자기 도피는 처벌하지 않는다는 일반론만 썼다.
          2: 통상적 도움 요청의 불가벌과 방어권 남용의 예외를 제시했으나 예외의 뜻을 설명하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-II-4-b
        points: 3
        criterion: 사촌에게 은신처와 휴대전화를 제공해 달라고 한 내용·관계·수사에 미치는 영향을 검토하여 허위 범인 내세우기 등 적극적 사법 방해가 없는 통상적인 도움이라고 적용한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 은신처·휴대전화 요청 사실 또는 남용이 아니라는 결론만 썼다.
          2: 두 도움의 내용과 통상적 도피를 연결했으나 관계나 적극적 수사 방해의 부재를 설명하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-II-4-c
        points: 2
        criterion: 이을남 자신의 요청이 방어권 남용이 아니므로 범인도피교사 무죄를 구하며, 김갑동의 친족 특례가 자동으로 교사자에게 확장된다는 이유로 대신하지 않는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 무죄를 구했지만 김갑동이 친족이라 불가벌이므로 교사자도 자동 불가벌이라는 이유만 들었다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
