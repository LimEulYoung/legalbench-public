  - id: K-II-5
    title: 5. 운전자폭행과 축소폭행
    points: 12
    expected: 125cc 오토바이는 특가법상 자동차가 아니고 운행 중도 아니다. 축소폭행은 기소 전 처벌불원으로 공소기각.
