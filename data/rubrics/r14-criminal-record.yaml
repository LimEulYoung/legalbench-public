        points: 2
        criterion: 밀고 얼굴을 때린 행위는 포함된 단순폭행으로서 방어권 불이익 없이 공소장변경 없이 판단할 수 있고, 폭행은 반의사불벌죄임을 설명한다.
        scoring:
