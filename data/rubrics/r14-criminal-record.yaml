  scope:
  - 'Ⅰ 김갑동 검토의견서 60점: 객관적 증거·법리 검토와 예상 판단. 정상관계는 평가하지 않는다.'
  - 'Ⅱ 이을남 변론요지서 40점: 유리한 법리 주장과 유죄 인정 공소사실의 간략한 정상변론.'
  - 양식의 본문만 작성하며 공소사실 요지는 평가에서 제외한다. 판례와 다른 견해를 택하면 판례 취지를 먼저 적시한다.
  grading_rules:
  - 항목별 만점·부분점수 조건 중 충족한 가장 높은 점수 하나를 부여한다. 허용 답안과 명시된 상한을 함께 적용하고 임의의 점수 단계를 만들지 않는다.
  - 동일 쟁점의 논증은 답안 전체에서 찾아 인정한다. 교재의 문구·분량·판례번호나 논증 순서 자체를 요구하지 않는다.
  - 기록의 사실과 작성 지시를 전제로 하며, 시험 기준일 이후의 법령·판례를 요구하지 않는다. 문제의 가상 법령이 실제 법령보다 우선한다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 내용을 기준답안에서 가져와 작성한 것으로 인정하지 않는다.
  - 조건에 없는 합리적 대안은 검토 대상으로 남긴다. 미검토라는 이유로 이미 규정된 허용 답안의 점수를 낮추지 않는다.
  - 김갑동의 객관적 검토와 이을남의 변론을 구별한다. 이을남의 특수강도에는 기록에 근거한 정상변론을 평가하며, 문서 전체에 별도 재량점수는 없다.
  - 증거능력은 피고인·공소사실별로 판단한다. 김갑동이 부동의한 조서를 이을남이 동의하였다는 이유로 김갑동에게 사용할 수 없고, 나피해 진술조서도 여신이 부분과 본인 피해 부분을 구별한다.
  - 형사소송법 조문은 2025.1.15. 기준이다. 검사 피의자신문조서는 제312조 제1항, 고소취소는 제327조 제5호, 공소제기 전 처벌불원으로 인한 절차 무효는 제327조 제2호를 기준으로 한다.
  - 특수강도교사 불인정 뒤 축소사실 유죄, 운전자폭행 불성립 뒤 축소폭행의 공소기각을 판단하는 경우 두 개의 별도 주문을 요구하지 않는다.
  - 특수상해의 기판력은 피해자가 다름을 반영한 동일성 논증을 평가한다. K-II-3에 명시된 별개 범행·정상변론 대안도 인정한다.
