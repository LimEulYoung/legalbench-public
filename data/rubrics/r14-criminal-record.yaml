        points: 4
        criterion: 특가법 제5조의10의 자동차는 도로교통법상 개념이고 125cc 이하 이륜차는 원동기장치자전거이므로, 정확히 125cc인 이 오토바이는 제외된다. 자동차관리법상 이륜자동차라는
          반론을 배척한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 125cc라 특가법을 적용할 수 없다는 결론만 썼다.
          2: 도로교통법상 원동기장치자전거 제외와 125cc를 적용했으나 자동차관리법상 분류와 구별하지 않았다.
          3: 두 법률의 분류와 125cc 적용은 맞지만 이하라는 경계를 잘못 써서 정확히 125cc의 해당 이유가 불명확하다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
