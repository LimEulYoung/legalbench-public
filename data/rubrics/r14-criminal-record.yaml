  - id: K-I-2
    title: 2. 카메라등이용촬영
    points: 22
    expected: 임의제출 사진은 구체적 관련성과 참여·압수 과정상 증거능력이 있다. 9.1.·9.5.·9.16.은 유죄, 9.15. 여신이 부분은 증명 부족 무죄.
    sections:
    - title: 2. 카메라등이용촬영
      points: 22
      items:
      - id: K-I-2-a
        points: 3
        criterion: 임의제출 매체는 제출 동기가 된 혐의와 구체적 관련성이 있는 정보로 압수가 제한됨을 설명하고, 가까운 시기·공공장소·같은 촬영 방식·반복적 성적 기호를 이 사건 사진의
          관련성과 연결한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 임의제출 사진이라 증거능력이 있다거나 관련성이 있다는 결론만 썼다.
          2: 구체적 관련성 법리와 기록 사정 하나를 적용했으나 시기·수법·동기의 연결은 부족하다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 기록 사정 두 가지 이상으로 개별 연관관계를 설명하면 3점이다. 동종 전과가 있으면 모든 사진을 압수할 수 있다는 일반화는 최대 1점이다.
        accept_label: 허용 답안
      - id: K-I-2-b
        points: 3
        criterion: 전자정보 탐색·출력 시 참여 기회를 보장해야 하고, 김갑동이 경찰관과 함께 사진을 확인하고 촬영 경위를 설명한 점에서 실제 참여가 보장되었다고 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 참여권이 보장되었다는 결론만 썼다.
          2: 참여권 법리를 설명했으나 실제 확인·설명 사실 중 하나만 적용했다.
