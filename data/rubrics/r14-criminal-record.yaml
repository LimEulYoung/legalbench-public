        points: 3
        criterion: 피해남은 식사를 위해 주차하고 시동을 끈 뒤 내리던 중이므로 운행 중 운전자가 아니며, 여객 운송의 승하차를 위한 일시정차 예외도 아니라고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 운행 중이 아니라고만 썼다.
          2: 주차·시동 정지와 운행 종료를 연결했으나 여객 승하차 정차와 구별하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
