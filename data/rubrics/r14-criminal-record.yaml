documents:
- id: K-I
  title: 김갑동 검토의견서
  points: 60
  issues:
  - id: K-I-1
    title: 1. 특수강도교사와 축소사실
    points: 26
    expected: 특수강도 교사의 증명은 부족하다. 증거능력과 신빙성을 구별하고, 고소가 유지되는 야간주거침입절도교사의 유죄를 예상한다.
    sections:
    - title: 1. 특수강도교사와 축소사실
      points: 26
      items:
      - id: K-I-1-a
        points: 2
        criterion: 공범 이을남의 경찰 피의자신문조서는 당해 피고인 김갑동의 내용부인으로 제312조 제3항에 따라 증거능력이 없다고 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 경찰 조서를 배제했지만 누가 내용을 부인했는지 또는 그 효과를 설명하지 않았다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-1-b
        points: 2
        criterion: 공범 이을남의 검사 피의자신문조서도 김갑동의 내용부인으로 제312조 제1항의 요건을 갖추지 못하여 증거능력이 없다고 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 검사 조서를 배제했으나 경찰 조서와 작성 주체별 요건을 구별하지 못하거나 이을남의 부인 때문이라고 잘못 썼다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 경찰·검사 조서를 한 문장으로 설명해도 김갑동의 내용부인과 두 조서의 배제 이유가 명확하면 각 만점이다.
        accept_label: 허용 답안
      - id: K-I-1-c
        points: 3
        criterion: 김부호의 법정진술과 고소장·경찰 진술조서 중 이을남에게 들은 교사 내용은 전문이고, 이을남이 법정에 출석하여 제316조 제2항의 진술불능 요건이 없어 증거능력이 없다고
          설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 전문진술이라 증거능력이 없다고만 썼다.
          2: 법정진술 또는 이를 옮긴 서류 중 한 종류에만 진술불능 요건을 적용했다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 고소장과 조서를 묶어서 적어도 된다. 김갑동의 지시까지 재전문 구조를 분석하여 부동의로 배제한 답안도 인정한다. 서류 자체 요건에 전문 예외가 추가로 필요하다는 취지가 있어야
          하며, 직접 경험한 김부호 진술까지 배제하면 최대 2점이다.
        accept_label: 허용 답안
      - id: K-I-1-d
        points: 4
        criterion: 김부호는 김갑동·이을남의 대화에 참여하지 않은 제3자이므로 몰래 녹음한 USB·녹취록은 통신비밀보호법상 사용할 수 없고, 증거동의나 압수조서·목록을 통해 녹음 내용의
          증거 사용을 정당화할 수 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 불법녹음이므로 배제된다는 결론만 썼다.
          2: 통화가 연결되어 있어도 타인 간 대화인 점과 배제 법리를 설명했으나 녹취록 또는 동의 효과가 빠졌다.
          3: 녹음·녹취록과 동의 효과는 설명했으나 이를 옮긴 서류를 통한 우회 사용 문제는 다루지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 압수목록의 물건 수령 사실 자체가 존재하지 않는다는 뜻을 요구하지 않는다. 위법 녹음의 내용 증명에 이용할 수 없다는 범위면 충분하다.
        accept_label: 허용 답안
      - id: K-I-1-e
        points: 2
        criterion: 법원 작성 구속적부심문조서는 제315조 제3호의 특히 신용할 만한 정황에서 작성된 문서로 특별한 사정이 없으면 증거능력이 있고, 부동의와 별개로 증명력은 검토해야 한다고
          설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 구속적부심문조서의 증거능력을 인정했으나 법적 근거 또는 증명력과의 구별이 빠졌다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-1-f
        points: 6
        criterion: 이을남의 방망이 확보 경위가 자기 집 보관→김갑동의 구매→골프채와 비교 후 구매로 바뀐 점, 김부호의 비공개 출장 취소와 빈집으로 안 김갑동의 설명, 이을남의 책임 전가
          가능성을 대조하여 강도 교사의 증명이 부족하다고 평가한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 이을남 진술을 믿기 어렵다거나 증거가 부족하다고만 썼다.
          2: 신빙성을 의심할 구체적 사정 하나를 이유와 함께 제시했다.
          4: 방망이 확보 경위의 변화와 출장 취소 사실을 모두 구체적으로 대조했으나 책임 전가 등 이해관계나 남은 증거에 대한 종합 판단은 빠졌다.
          6: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 같은 취지의 다른 구체적 모순·석방을 바라는 구속적부심 진술의 한계를 제시해도 인정한다. 증거능력 없는 수사 진술은 일관성 비교에 쓸 수 있지만 범죄사실의 직접 증거로 사용하지
          않는다. 단순히 경찰 진술을 사실로 채택하여 강도 교사를 부정하면 최대 2점이다.
        accept_label: 허용 답안
      - id: K-I-1-g
        points: 3
        criterion: 빈집에서 훔치도록 시킨 자백과 이을남·김부호의 법정진술 등을 근거로 교사 범위 내 야간주거침입절도교사를 인정하고, 방어권 불이익이 없어 공소장변경 없이 축소사실을 판단할
          수 있다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 야간주거침입절도교사 유죄라는 결론만 썼다.
          2: 자백 외 증거나 교사 범위를 설명했으나 축소사실의 직권 판단과 방어권 문제는 빠졌다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 자신의 경찰·검찰 자백만 반복해 독립된 보강증거가 있다고 한 것은 인정하지 않는다.
        accept_label: 허용 답안
      - id: K-I-1-h
        points: 4
        criterion: 김부호와 김갑동이 비동거 처남·매제 관계이므로 절도교사는 친고죄이지만, 2024.11.17. 고소가 있고 장물취득 부분의 고소취소가 절도교사까지 미치지 않으므로 유죄를
          예상한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 친족상도례 또는 고소 존재만 언급했다.
          2: 비동거 인척이라 고소가 필요하고 고소가 있었다고 했으나 취소 범위를 검토하지 않았다.
          3: 고소취소가 장물취득에 한정됨을 구별했으나 축소사실 유죄와 연결하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 형법 제344조·제328조 제2항이 근거이다. 조문번호 생략은 감점하지 않는다. 특수강도교사 무죄를 별도 주문으로 병기하면 최종 판결 형식은 부정확하므로 최대 3점이다.
        accept_label: 허용 답안
    reference_sections:
