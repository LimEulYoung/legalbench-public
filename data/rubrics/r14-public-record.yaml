        points: 4
        criterion: 양도인 빅토리고속의 1억 원은 원고가 받은 보조금이 아니다. 지위승계 조항만으로 대인적 보조금 반환의무까지 이전되지 않으므로 원고에게 환수할 수 없다고 설명한다.
