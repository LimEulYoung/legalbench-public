  scope:
  - 'Ⅰ 행정소장 ①~⑧: 50점. 적법요건은 제소기간만, 본안은 내부회의록의 환수·제외처분 논거만 작성한다.'
  - 'Ⅱ 위헌법률심판제청신청서 ①~⑤: 50점. 재판의 전제성과 지정 위헌 논거를 작성하며 평등원칙·필요적 전치주의는 다루지 않는다.'
  - 행정소장 작성일은 두 처분을 제소할 수 있는 최종일이다. 헌법 신청취지에는 개정연혁을 적지 않는다.
  grading_rules:
  - 항목별 만점·부분점수 조건 중 충족한 가장 높은 점수 하나를 부여한다. 허용 답안과 명시된 상한을 함께 적용하고 임의의 점수 단계를 만들지 않는다.
  - 동일 쟁점의 논증은 답안 전체에서 찾아 인정한다. 교재의 문구·분량·판례번호나 논증 순서 자체를 요구하지 않는다.
  - 기록의 사실과 작성 지시를 전제로 하며, 시험 기준일 이후의 법령·판례를 요구하지 않는다. 문제의 가상 법령이 실제 법령보다 우선한다.
  - 기준답안은 법리와 사실 적용의 참고자료이다. 수험 답안에 없는 내용을 기준답안에서 가져와 작성한 것으로 인정하지 않는다.
  - 조건에 없는 합리적 대안은 검토 대상으로 남긴다. 미검토라는 이유로 이미 규정된 허용 답안의 점수를 낮추지 않는다.
  - 행정소장 50점·위헌법률심판제청신청서 50점으로 평가한다.
  - 위헌 제청은 의뢰인에게 유리한 합리적인 주장을 평가한다. 실제 2019헌바530의 합헌 다수의견을 이 사건의 기준 결론으로 강제하지 않는다.
  - 제외처분의 조례상 기속성과 추가 법률상 재량성을 구별한다. 추가 불허·소급적용 불가·재량권 일탈은 단계적인 예비 논증으로 함께 평가한다.
  - 경어 미사용은 판단 이유에만 적는다. 문체·분량에 관한 별도 감점은 만들지 않는다.
