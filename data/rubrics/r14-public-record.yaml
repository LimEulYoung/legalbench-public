  - id: P-I-2
    title: ④ 제소기간
    points: 10
    expected: 3.15. 이의신청과 6.4. 심판청구는 적법하다. 각하재결에 구속되지 않고 8.6. 재결서 송달일부터 90일인 11.4.까지 제소할 수 있다.
