  - id: P-I-4
    title: ⑥ 제외처분
    points: 20
    expected: 조례의 위임 근거가 없고 기속규정에서 재량규정으로의 근거 추가도 허용되지 않는다. 예비적으로 행위시법·재량통제 위반을 주장한다.
    sections:
    - title: ⑥ 제외처분
      points: 20
      items:
