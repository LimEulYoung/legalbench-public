    - title: ④ 제소기간
      points: 10
      items:
      - id: P-I-2-a
        points: 3
        criterion: 행정기본법 제36조에 따라 처분 통지 후 30일 이내 이의신청, 그 결과 통지 후 90일 이내 행정심판이 가능함을 설명하고 2.28.→3.15., 3.28.→6.4.에
          적용한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 이의신청 후 기간을 다시 계산한다는 취지 또는 두 신청이 적법하다는 결론을 썼다.
          2: 두 기간 규칙은 설명했으나 하나의 신청에만 날짜를 적용했다. 또는 날짜와 적법 결론은 모두 맞으나 30일·90일 규칙 중 하나가 빠졌다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-b
        points: 3
        criterion: 기간 도과를 이유로 한 행정심판의 각하는 잘못이며, 법원은 심판청구의 적법성을 독립 판단하므로 적법한 심판을 거친 경우의 제소기간 특례가 적용된다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 각하재결이 잘못되었다고만 했다.
          2: 심판청구가 적법하여 특례를 적용한다고 했으나 법원이 위원회 판단에 구속되지 않는다는 설명이 없다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: P-I-2-c
        points: 4
        criterion: 행정소송법 제20조 제1항 단서에 따라 2024.8.6. 재결서 송달 다음 날부터 90일을 계산하여 두 처분 모두 2024.11.4.까지 제소할 수 있다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 90일의 제소기간 또는 11.4.까지라는 결론만 제시했다.
          2: 재결서 송달일부터 90일이라는 법리와 8.6. 송달 사실을 연결했으나 마지막 날을 틀리거나 적지 않았다.
          3: 8.6.부터 11.4.까지 계산하고 적법하다고 했으나 재결서 송달을 기산점으로 삼는 90일 규칙은 설명하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
