    title: 당사자·사건명·제출 형식
    points: 5
    expected: 서나경의 단일 공동소송 소장. 청구별 피고와 관할·날짜를 특정.
    reference_sections:
    - 소장 / 당사자와 사건명
    - 소장 / 결론과 제출
    sections:
    - title: 기본 서면
      points: 5
      items:
      - id: C-0-a
        points: 2
        explanation: 이 항목은 원고·대리인의 이름과 청구취지에서 이행할 사람의 식별을 본다. 어느 피고에게 청구해야 하는지를 잘못 판단한 오류는 해당 청구에서 평가하므로 여기서 다시
          감점하지 않는다.
        criterion: 원고 서나경과 소송대리인 한명변의 이름을 기재하고, 청구취지에서 각 피고를 성명으로 표시하여 누구에게 이행을 구하는지 알 수 있게 한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 원고·대리인 중 한 사람의 이름을 빠뜨리거나 잘못 적었다. 또는 청구취지에 피고 번호만 사용하여 이행할 사람의 성명을 확인할 수 없다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 피고를 누락하거나 잘못 선정한 경우에는 해당 청구의 평가항목에서 채점한다. 이 당사자 표시 항목에서는 그 오류로 추가 감점하지 않는다.
        accept_label: 중복 감점 방지
      - id: C-0-b
        points: 1
        criterion: 추심금 등 청구의 소와 같이 복수 청구를 포괄하는 사건명을 기재하고 소장 형식으로 청구취지와 청구원인을 구별한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-0-c
        points: 1
        explanation: 기록상 당사자의 주소, 이행지, 부동산 소재지 등 관할 근거가 있는 법원 한 곳이면 된다. 기준답안의 서울중앙지방법원만 정답인 것은 아니며, 허용 목록에 든 다른
          법원도 인정한다.
        criterion: 관할권 있는 법원 한 곳을 제출처로 기재한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 피고의 주소와 공동소송 관할에 따라 서울중앙·서울남부·춘천·수원지법 성남지원·안양지원·대구지법을 기재할 수 있다. 금전채무의 이행지 등을 근거로 한 서울동부지법과, 횡성 토지의
          소재지·등기소 관할(민사소송법 제20조·제21조)을 근거로 한 춘천지법 원주지원도 인정한다. 소송대리인 사무실이 있다는 이유만으로 관할을 인정하지 않는다.
        accept_label: 허용 답안
      - id: C-0-d
        points: 1
        criterion: 소장에 작성일을 2026. 1. 9.로 기재한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
  - id: C-1
    title: 박보증 — 추심금
    points: 29
    expected: 보증채권을 추심하여 1억 원 및 2020.3.10.부터 10%, 송달 다음날부터 12% 청구.
    reference_sections:
    - 소장 / 청구취지 / 박보증에 대한 추심금
    - 소장 / 청구원인 / 1. 피고 박보증에 대한 추심금 청구
    sections:
    - title: 청구취지
      points: 7
      items:
      - id: C-1-a
        points: 3
        explanation: 원고가 김인수에게 받을 돈은 2억 원이지만, 여기서 추심하는 대상은 김인수의 박보증에 대한 보증채권이다. 화해 후 남은 보증원금 1억 원을 원고에게 지급하도록 구했는지
          확인한다.
        criterion: 박보증이 원고에게 1억 원을 지급하도록 청구한다. 집행채권 2억 원이나 원 보증원금 1억 5천만 원을 그대로 청구하지 않는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 박보증에게 돈을 지급하라고 청구했으나, 지급받을 사람을 원고로 특정하지 않았다.
          2: 박보증이 원고에게 지급하도록 청구했으나, 원금을 1억 원과 다른 금액으로 적거나 금액을 빠뜨렸다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-1-b
        points: 4
        explanation: 지연손해금은 소장부본 송달일까지의 연 10%와 그 다음 날부터의 연 12%로 나누어 확인한다. 두 이율이 맞고 날짜 한 곳만 잘못된 경우의 3점 조건과 한 구간만
          맞춘 2점 조건을 구별한다.
        criterion: 1억 원에 대하여 2020. 3. 10.부터 소장부본 송달일까지 연 10%, 그 다음날부터 완제일까지 연 12%의 지연손해금을 청구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: '원금에 대한 지연손해금 지급을 청구했으나 2점 이상의 조건을 충족하지 못했다. 예: 기간과 이율을 모두 생략했거나, 날짜는 맞지만 두 이율을 모두 잘못 적은 경우.'
          2: 두 구간 중 한 구간의 시작일과 이율을 모두 맞게 기재했다.
          3: 연 10%와 연 12%를 해당 구간에 맞게 기재했고, 날짜의 오류·누락은 한 구간의 시작일 또는 종료일에만 있다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 소장부본 송달일은 기록에 확정되어 있지 않으므로 실제 날짜를 만들어 쓰지 않고, “소장부본 송달일까지”와 “그 다음 날부터”로 기재한다.
        accept_label: 채점 유의사항
    - title: 청구원인·항변
      points: 22
      items:
      - id: C-1-c
        points: 4
        explanation: 건축자재 공급으로 생긴 주채무와 박보증의 보증을 먼저 확인한다. 부종성은 보증채무가 주채무의 범위에 따라 줄어든다는 뜻이므로, 화해로 정한 원금·지연손해금이 보증
          범위에도 반영된다는 설명이 필요하다.
        criterion: 김인수의 건축자재 매도·인도, 이행원의 대금채무, 박보증의 보증을 밝힌다. 재판상 화해로 주채무가 1억 원과 2020. 3. 10.부터 10%로 정리되어 보증도 부종성에
          따라 그 범위로 축소됨을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 박보증에게 보증채무가 있다고 기재했다.
          2: 김인수의 건축자재 공급, 이행원의 대금채무, 박보증의 보증을 기재했다.
          3: 거래·보증과 재판상 화해의 원금·지연손해금까지 기재했으나, 보증채무도 화해로 정한 범위까지 줄어든다는 설명이 없다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-1-d
        points: 4
        explanation: 원고의 김인수에 대한 채권은 집행의 근거이고, 김인수의 박보증에 대한 채권은 압류·추심의 대상이다. 두 채권을 구별하고 추심명령이 박보증에게 송달되어 원고의 추심권한이
          생겼다는 순서를 확인한다.
        criterion: 원고의 김인수에 대한 2억 원 집행채권과 박보증에 대한 피압류 보증채권을 구별한다. 집행력 있는 공정증서에 기한 2025타채20135 압류·추심명령 및 2025. 9.
          10. 박보증 송달로 원고가 추심할 권한을 갖는다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 원고가 압류·추심명령을 받았다고 기재했다.
          2: 원고의 김인수에 대한 집행채권과 김인수의 박보증에 대한 보증채권을 구별했다. 추심명령의 송달과 추심권한 발생은 설명하지 않았다.
          3: 두 채권을 구별하고 박보증에 대한 송달로 추심권한이 생긴다고 설명했으나, 집행력 있는 공정증서 또는 압류·추심명령의 특정이 빠졌다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-1-e
        points: 4
        explanation: 물품대금의 원래 3년 시효, 소 제기에 따른 중단, 화해 후 10년 시효의 연결을 본다. 화해 후 10년과 미완성을 설명했다면 앞 단계의 연결이 부족해도 3점으로
          인정한다. 보증채무의 별도 시효와 구별한다.
        criterion: 물품대금 주채무의 3년 단기시효가 변제기 2016. 12. 10.부터 완성되기 전에 2019. 10. 10. 소 제기로 중단되고, 2020. 10. 10. 재판상 화해로
          확정된 채권은 10년 시효여서 제소일에 소멸하지 않았다고 반박한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 주채무의 소멸시효가 완성되지 않았다는 결론을 제시했으나 2점 이상의 조건을 충족하지 못했다.
          2: 원래 물품대금에 3년의 시효가 적용되고, 완성 전인 2019년 소 제기로 시효가 중단됨을 설명했다.
