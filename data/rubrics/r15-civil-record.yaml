  scope:
  - 서나경을 위한 175점 소장
  - 제소일 2026.1.9.; 승소 가능한 최대 범위; 이자 등에 복리 손해금 제외
  - 한 법원에 한 건의 공동소송; 예비적·선택적 병합 제외; 피고를 성명으로 특정한다.
  - 기록의 사실은 참으로 보되 작성자의 법률의견은 평가한다. 타당한 항변은 청구 범위에 반영한다.
  - 증명방법·첨부서류·별지 재작성 및 증거자료 번호 제시는 생략한다.
  grading_rules:
  - 각 항목에서 만점·부분점수 조건을 여러 개 충족하면 가장 높은 점수 하나를 부여한다. 허용 답안, 점수 상한, 중복 감점 방지의 개별 규칙을 함께 적용한다. 조건에 없는 타당한 해법이나 미결 판단은
    점수를 임의로 확정하지 않고 검토 대상으로 남긴다.
  - 단일 소장으로 평가한다. 기본형식 5점, 청구취지 50점, 청구원인·항변 120점이며 피고별 권리관계 묶음을 유지한다. 공식 총점 이외의 배분은 연구용 기준이다.
  - 청구취지는 집행할 급부·조건·상대방을, 청구원인은 이를 뒷받침하는 사실·법리와 항변 처리를 평가한다. 청구취지의 문구를 본문에 반복하기만 하면 원인 점수가 생기지 않는다.
  - 예상 항변이 타당하면 청구 범위에 반영하고 부당하면 이유를 설명한다. 타당한 항변을 무조건 부인하는 답안에 점수를 주지 않는다.
  - 원기록의 사실은 참으로 전제하지만 당사자 문서의 법률의견은 별도로 평가한다. 공탁 수리 사실과 변제의 실체적 효력을 구별한다.
  - 청구원인의 당사자별 분리는 권장사항이다. 논리가 분명한 다른 목차·원용을 불이익으로 처리하지 않는다. 증거번호·증명방법·첨부서류·별지 재작성은 요구하지 않는다.
  - 예비적·선택적 병합은 하지 않는다. 허용 대안은 채점자가 인정하는 복수 해법이며 답안에 대안들을 모두 청구하라는 뜻이 아니다.
  - 소송비용은 피고들 부담으로 하고, 가집행은 금전 지급과 인도를 명하는 부분으로 한정한다(C-7). 등기·말소처럼 의사표시를 명하는 부분이나 사해행위 취소·가액배상 부분에 가집행을 구하면 가집행
    항목은 0점이다.
  - 단순 계산오류가 후속 취지에 기계적으로 반복된 경우 명시된 이월 인정만 적용하고 추가 총점 감점은 하지 않는다. 법적 금액 산정 자체가 다른 견해는 계산오류로 보지 않는다.
