    title: 현옥희 — 횡성 토지 담보가등기 말소
    points: 30
    expected: 선이행 조건을 붙인 장래 말소 청구. 일부공탁은 효력이 없어 7천만 원과 2025.1.1.부터 월 1%를 먼저 지급한 다음 말소.
    reference_sections:
    - 소장 / 청구취지 / 현옥희에 대한 가등기 말소
    - 소장 / 청구원인 / 3. 현옥희에 대한 담보가등기 말소청구
    sections:
    - title: 청구취지
      points: 8
      items:
      - id: C-3-a
        points: 3
        explanation: 어느 토지의 어느 가등기를 말소할 것인지 구별되게 청구했는지 본다. 말소할 등기의 종류·목적물·등기 접수정보를 확인하며, 먼저 갚아야 할 금액과 지급 순서는 다음
          항목에서 평가한다.
        criterion: 현옥희에게 별지 1 토지의 춘천지방법원 횡성등기소 2024. 3. 2. 접수 77414호 소유권이전청구권가등기의 말소등기절차 이행을 청구한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 토지의 소유권이전청구권가등기를 말소하라고 청구했다.
          2: 현옥희, 별지 1 토지, 말소할 가등기를 구별할 수 있으나 등기 접수일 또는 접수번호를 잘못 적거나 빠뜨렸다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 등기소 명칭을 생략해도 목적물·가등기권자·등기 종류·접수정보로 해당 가등기가 명확히 특정되면 인정한다. 접수일·번호 오류는 2점 조건에 따라 평가한다.
        accept_label: 허용 답안
      - id: C-3-b
        points: 5
        explanation: 원고가 남은 채무를 먼저 갚고 그 다음 가등기를 말소하는 순서다. 금액·이율은 맞지만 동시이행으로 쓴 경우와, 선이행 순서는 맞지만 금액·이율 등이 틀린 경우를 구별한다.
          단순 계산오류를 본문에서 이미 감점한 경우에는 명시된 중복 감점 방지 규칙을 적용한다.
        criterion: 원고가 잔존 피담보채무 7천만 원과 2025. 1. 1.부터 완제일까지 월 1%의 돈을 지급한 다음 말소하도록 선이행 조건을 붙인다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 잔존채무를 지급하는 조건으로 말소를 구했으나, 3점 이상의 조건을 충족하지 못했다.
          3: 원고가 먼저 채무를 지급한 다음 말소하도록 청구했으나, 원금·이율·기산일 중 하나 이상을 잘못 적거나 빠뜨렸다. 일부공탁을 유효로 보아 원금을 51,400,000원으로 계산한 답안도
            이 조건에 포함한다.
          4: 원금 7천만 원, 2025. 1. 1.부터 월 1%의 조건은 맞지만, 먼저 지급한 다음 말소하도록 구하지 않고 지급과 말소를 동시에 이행하도록 구했다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 이 청구의 청구원인에서 잔존채무의 단순 계산오류로 이미 감점했다면, 같은 계산값을 청구취지에 옮긴 것만으로 추가 감점하지 않는다. 일부공탁을 유효로 판단하여 금액이 달라진
          경우에는 이 예외를 적용하지 않는다.
        accept_label: 중복 감점 방지
    - title: 청구원인·항변
      points: 22
      items:
      - id: C-3-c
        points: 5
        explanation: 기존 물품대금 등을 대여금으로 바꾼 준소비대차와 담보 목적을 확인한다. 토지 전체 가격이 아니라 선순위 담보를 뺀 4억 8천만 원을, 원금과 변제기까지 이자를 합한
          4억 4천만 원과 비교한다.
        criterion: 물품대금·손해금을 4억 원 대여금으로 전환한 준소비대차 및 그 담보로 설정한 가등기임을 밝힌다. 예약 당시 5억 8천만 원에서 선순위 담보 1억 원을 빼면 4억 8천만
          원으로 대여원리금 4억 4천만 원보다 커 가등기담보법이 적용된다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 가등기가 채무를 담보하기 위한 것이라고 판단했다.
          3: 물품대금·손해금을 4억 원 대여금으로 전환했고 가등기가 그 채무를 담보한다고 설명했다. 선순위 담보액 1억 원의 공제 또는 대여원리금 4억 4천만 원과의 비교는 빠졌다.
          4: 토지가액에서 선순위 담보액을 빼고 대여원리금과 비교하는 방법은 맞지만, 그 계산에서 산술오류가 있다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-3-d
        points: 3
        explanation: 등기 명칭보다 거래 실질과 당사자의 의사로 담보가등기 여부를 판단한다. 합의서의 담보 약정 등 충분한 기록 근거를 항변에 대한 반박으로 연결하면 된다. 청산 통지는
          보충 근거이므로 반드시 함께 나열할 필요는 없다.
        criterion: 담보가등기 여부는 매매예약이라는 등기원인 명칭만으로 결정하지 않고 거래 실질과 당사자의 의사로 판단한다. 합의서의 담보 약정 등 담보 목적을 보여주는 기록 근거를 적용하여
          매매예약 등기이므로 다툴 수 없다는 항변을 배척한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 등기원인이 매매예약이라고 적혀 있다는 이유만으로 담보가등기임을 다툴 수 없는 것은 아니라고 결론을 제시했다.
          2: 등기 명칭보다 거래 실질과 당사자 의사를 기준으로 판단한다고 설명했으나, 담보 목적을 보여주는 기록 근거를 적용하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 등기의 추정력을 설명하는 표현이 달라도, 합의서의 명시적 담보 약정 등 거래 실질을 입증하는 충분한 기록 근거를 적용했다면 인정한다. 청산 통지 등 보충 근거를 모두 나열하도록
          요구하지 않는다.
        accept_label: 허용 답안
      - id: C-3-e
        points: 3
        explanation: 후순위 권리자 등을 보호하는 담보 범위의 제한과 채무자 자신의 변제의무를 구별한다. 원고가 말소를 받으려고 갚을 돈을 지연손해금 1년분으로 줄일 수 없다는 적용을
          확인한다.
        criterion: 민법 360조단서의 1년분 지연배상 제한은 제3자 보호의 문제이므로 채무자인 원고가 자기 변제범위를 1년으로 한정할 수는 없다. 전체 기간의 지연손해금을 선이행액에 반영한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 1년을 넘는 지연손해금도 변제 범위에 포함했으나 이유를 설명하지 않았다.
          2: 민법 제360조 단서가 제3자를 보호하는 규정이라고 설명했으나, 채무자인 원고가 이를 들어 자신의 변제액을 줄일 수 없다는 결론은 제시하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 가등기담보법 제3조 제2항의 ‘민법 제360조에 규정된 채권액’은 청산금 통지에 관한 규정이므로, 채무자가 말소를 구하며 갚을 범위를 1년분으로 줄이는 근거가 되지 않는다.
          1년분만 갚으면 말소를 구할 수 있다고 본 답안은 0점이다.
        accept_label: 채점 유의사항
      - id: C-3-f
        points: 6
        explanation: 먼저 2024년 말 변제 후 원금 7천만 원이 남는지 확인하고, 그 뒤 일부공탁에 변제효력이 있는지 판단한다. 공탁 접수와 채무 소멸은 별개다. 일부공탁을 유효로
          본 경우의 3점도 지연손해금 충당과 잔액 계산을 갖추어야 한다.
        criterion: 2024. 12. 31. 이자 전부와 원금 3억 3천만 원 변제로 7천만 원이 남았다. 2025. 2. 28.의 2천만 원은 채무 일부의 공탁이고 채권자가 수령을 거부했으며
          일부변제 허용 합의가 기록에 없어 원칙적으로 변제효과가 없다. 따라서 잔액 7천만 원과 2025. 1. 1. 이후 월 1%를 산정한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 2024. 12. 31. 변제 후 남은 원금을 7천만 원으로 계산했다.
          3: 일부공탁을 유효로 보고, 공탁액에서 지연손해금 140만 원을 먼저 충당한 뒤 원금 51,400,000원이 남는다고 계산했다.
          4: 일부공탁은 원칙적으로 무효이고 현옥희도 수령을 거부했다고 설명했으나, 잔액 7천만 원 또는 2025. 1. 1.부터 월 1%라는 계산 결과를 잘못 적거나 빠뜨렸다.
          6: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 공탁소가 공탁을 받아 주었다는 사실만으로 변제효력을 인정하지 않는다. 기록에는 현옥희가 일부 변제를 받아들이거나 공탁금을 수령한 사정이 없으므로, 일부공탁을 유효로 본 답안은
          최대 3점이다. 지연손해금 충당과 잔액 계산이 3점 조건을 충족해야 3점을 주고, 그렇지 않으면 충족한 하위 점수 조건을 적용한다.
        accept_label: 채점 유의사항
      - id: C-3-g
        points: 3
        explanation: 청산기간이 지났다는 사실과 청산금을 실제 받았다는 사실을 구별한다. 아직 청산금이 지급되지 않았다는 기록을 근거로, 원고가 채무 전액을 갚고 말소를 구할 수 있음을
          설명했는지 본다.
        criterion: 청산기간이 경과했더라도 청산금을 실제로 지급받기 전이고 법정 제한사유가 없으므로 채무 전액을 변제하여 말소를 구할 수 있다. 아직 청산금을 지급하지 않은 현옥희의 기간
          경과 항변을 배척한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 채무를 변제하고 가등기 말소를 구할 수 있다는 결론을 제시했다.
          2: 가등기담보법 제11조에 따라 청산금 지급 전에는 채무를 변제하고 말소를 구할 수 있다고 설명했으나, 현옥희가 청산금을 지급하지 않은 사실에는 적용하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: C-3-h
        points: 2
        explanation: 원고가 아직 돈을 갚지 않았는데도 미리 판결을 구할 필요가 있는 이유를 본다. 현옥희가 가등기의 성격·잔액·말소의무를 다투고 있어 앞으로 변제하더라도 자발적 말소를
          기대하기 어렵다는 사실 적용을 확인한다.
        criterion: 현옥희가 담보가등기 성격·잔액·말소의무를 다투므로 앞으로 잔액 변제 후에도 임의 이행을 기대하기 어려워 미리 청구할 필요가 있는 장래이행의 소임을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 장래이행의 소이거나 미리 청구할 필요가 있다고 적었으나, 현옥희가 담보 성격·잔액·말소의무를 다투는 사실을 그 이유로 설명하지 않았다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
  - id: C-4
    title: 최진혁·양진경 — 판교동 주택 등기
    points: 30
    expected: 양진경→최진혁의 등기와 최진혁→원고의 8억 원 동시이행부 등기를 순차 청구.
    reference_sections:
    - 소장 / 청구취지 / 최진혁·양진경에 대한 등기
    - 소장 / 청구원인 / 4. 최진혁·양진경에 대한 소유권이전등기청구
    sections:
    - title: 청구취지
      points: 8
      items:
      - id: C-4-a
        points: 4
        explanation: 양진경에게 요구할 등기의 수령인은 최진혁이다. 원고에게 바로 등기하라는 청구와, 최진혁 앞으로 등기하되 매매일만 틀린 청구를 구별한다.
        criterion: 양진경이 최진혁에게 별지 2 부동산에 관하여 2025. 1. 5. 매매를 원인으로 한 소유권이전등기를 하도록 청구한다.
        scoring:
