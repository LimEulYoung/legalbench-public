documents:
- id: K-I
  title: 김갑동 검토보고서
  points: 40
  issues:
  - id: K-I-1
    title: 김갑동 — 특정범죄가중법상 절도
    points: 8
    expected: 세 번의 징역형 전력과 누범기간 내 절도를 인정하여 유죄.
    reference_sections:
    - Ⅰ. 김갑동에 대한 검토의견서 / 1. 특정범죄가중처벌등에관한법률위반(절도)의 점
    sections:
    - title: 법리와 적용
      points: 8
      items:
      - id: K-I-1-a
        points: 4
        explanation: 여기서는 실제로 징역형을 선고받은 횟수를 센다. 함께 재판할 수 있었던 범행이라는 이유로 2020년 선고를 빼서는 안 된다는 설명까지 있어야 한다. 세 번이라는 숫자만
          맞춘 경우와 그 항변을 반박한 경우를 구별한다.
        criterion: 특정범죄가중법 제5조의4 제5항 제1호의 세 번 이상 징역형 전력에 후단 경합범으로 따로 선고된 형도 포함한다. 2020년 야간주거침입절도 선고를 제외해야 한다는 변론을
          배척한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 세 번의 징역형 전력을 모두 산정했으나, 후단 경합범 관계인 2020년 선고를 제외할 수 없는 이유는 설명하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-1-b
        points: 4
        explanation: 세 차례의 징역형 전력, 최종 형 집행 종료 뒤 3년 안의 범행, 이번 절취를 뒷받침하는 증거를 연결한다. 김갑동 자신의 절도 성립과 이을남의 공동 가담 여부는 별도로
          판단한다.
        criterion: 2018·2020·2022년 각 징역형, 최종 집행종료 2023. 11. 28.와 2025. 6. 19. 범행을 연결한다. 자백과 피해·공범 진술 등 기록상 보강자료에
          따라 절취와 누범 요건을 인정하고 유죄로 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 가중절도죄의 유죄 결론을 제시했다.
          2: 세 차례 전력과 집행 종료 후 3년 이내 범행이라는 요건, 또는 자백과 이를 보강하는 절취 증거 중 한쪽을 기록에 적용했다.
          3: 전력·누범기간과 자백·보강증거를 모두 적용했으나, 그에 따른 가중절도죄 유죄 결론을 제시하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 김갑동의 가중절도 성립을 판단하는 항목이다. 이을남의 공동 가담이 증명되지 않았다는 이유만으로 이 항목의 유죄 판단을 부정하지 않는다. 전과 날짜나 증거명을 모두 열거할 필요는
          없다.
        accept_label: 채점 유의사항
  - id: K-I-2
    title: 김갑동 — 공갈 및 축소사실 폭행
    points: 12
    expected: 자기 소유 현금의 회수여서 공갈죄 불성립. 축소사실인 폭행은 공소시효가 완성되어, 이 공소사실에는 공갈 무죄를 따로 선고하지 않고 면소.
    reference_sections:
    - Ⅰ. 김갑동에 대한 검토의견서 / 2. 공갈의 점과 축소사실인 폭행
    sections:
    - title: 공갈 판단
      points: 5
      items:
      - id: K-I-2-a
        points: 5
        explanation: 자신의 돈을 받았다는 결론에 더하여, 맡긴 현금과 되찾은 현금이 같은 돈이라는 사실 적용을 확인한다. 이 항목은 공갈이 성립하지 않는 이유를 평가하며, 남아 있는
          폭행과 최종 재판 형식은 뒤 항목에서 평가한다.
        criterion: 검정 비닐봉지에 따로 보관된 현금 1억 원은 김갑동 소유이고 바로 그 돈을 회수하였다. 금전의 점유·소유 귀속을 기계적으로 동일시하지 않고, 공갈죄의 타인 재물 요건이
          충족되지 않아 공갈죄가 성립하지 않는다고 판단한다. 최종 재판의 형식은 K-I-2-c에서 평가한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 공갈죄가 성립하지 않는다는 결론을 제시했다.
          3: 자신의 돈을 되찾았으므로 타인의 재물을 취득한 것이 아니라고 설명했으나, 검정 봉지에 다른 돈과 섞이지 않고 보관된 동일 현금이라는 사실을 근거로 들지 않았다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 이 항목은 공갈죄가 성립하지 않는 이유를 평가한다. 구성요건에 해당하지 않는다는 설명(형사소송법 제325조 전단의 사유)을 기준으로 하고, 타인 소유라는 증명이 부족하다는
          설명(같은 조 후단의 사유)도 그 이유를 밝히면 인정한다.
        accept_label: 허용 답안
    - title: 폭행과 공소시효
      points: 7
      items:
      - id: K-I-2-b
        points: 3
        explanation: 공갈은 성립하지 않아도 얼굴을 때린 사실은 남는다. 그 폭행이 이미 공소사실에 포함되어 있고 별도의 공소장 변경 없이 판단해도 방어에 실질적 불이익이 없다는 두 연결을
          확인한다.
        criterion: 얼굴을 한 차례 때린 폭행은 공갈 공소사실에 포함된 축소사실이며 방어권에 실질적 불이익이 없으므로 공소장 변경 없이 심판할 수 있음을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 김갑동의 행위가 폭행에 해당한다고 판단했다.
          2: 공갈 공소사실에 폭행이 포함된다는 점 또는 폭행을 심판해도 방어권에 실질적 불이익이 없다는 점 중 하나를 설명했다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-2-c
        points: 4
        explanation: 5년은 축소사실인 단순폭행의 공소시효다. 범행일과 기소일을 비교하여 시효 완성과 면소를 설명하면 된다. 앞에서 공갈 불성립이나 무죄 사유를 설명했다는 이유만으로 별도
          무죄판결까지 구했다고 읽지 않는다.
        criterion: 단순폭행의 공소시효 5년을 적용한다. 2020. 3. 11. 범행부터 2025. 10. 15. 공소제기까지 이미 5년이 지났으므로 형사소송법 제326조 제3호에 따라
          면소판결을 한다고 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 폭행의 공소시효가 완성되었다고 판단했다.
          2: 2020. 3. 11. 범행과 2025. 10. 15. 공소제기를 비교하여 5년의 공소시효가 지났다고 설명했다.
          3: 5년의 공소시효 완성과 면소 결론을 제시했으나, 공갈죄 자체의 공소시효를 5년으로 잘못 계산했거나 공갈 무죄판결을 면소판결과 별도로 선고해야 한다고 명시했다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 공갈 불성립 또는 무죄 사유를 설명한 뒤 축소사실인 폭행의 공소시효 완성과 면소를 제시하면 인정한다. ‘공갈 무죄를 따로 선고하지 않는다’는 문구나 최종 주문의 관계에 관한
          별도 설명은 요구하지 않는다. 두 판단을 순서대로 적은 것만으로 별도 무죄판결을 선고해야 한다는 주장으로 해석하지 않는다. 무죄판결과 면소판결을 각각 선고해야 한다고 명시한 경우에만
          3점 조건을 적용한다. ‘공갈의 점에 대하여 면소’처럼 공소사실의 이름으로 결론을 적어도 같은 결론이다.
        accept_label: 채점 유의사항
  - id: K-I-3
    title: 김갑동 — 화물차 횡령과 친족상도례
    points: 14
    expected: 보관자 지위 인정. 지입차량의 대외적 소유자인 회사와는 친족관계가 없어 친족상도례가 적용되지 않는다. 공소장변경 없이 실제 소유자를 피해자로 인정할 수 있으므로 김을동의 고소취소와
      관계없이 유죄. 공소장변경 없이는 회사를 피해자로 인정할 수 없다는 근거를 갖춘 공소기각 결론도 인정.
    reference_sections:
    - Ⅰ. 김갑동에 대한 검토의견서 / 3. 횡령의 점 / 가. 포터 화물차의 처분
    sections:
    - title: 공통 실체 판단
      points: 4
      items:
      - id: K-I-3-a
        points: 4
        explanation: 차량을 맡아 보관하는 사람과 등록명의자는 같을 필요가 없다. 빌려서 지배하던 차량을 허락 없이 팔았다는 사실을 보관자 지위와 위탁 취지 위반에 각각 연결한다.
        criterion: 자동차 등록명의자가 아니어도 위탁받아 사실상 지배하는 사람은 횡령의 보관자가 될 수 있다. 김을동에게 2주간 빌린 화물차를 무단 매도한 사실에 적용하여 등록명의 부재만으로
          무죄라는 주장을 배척한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 김갑동이 차량의 보관자에 해당한다고 판단했다.
          2: 차량 등록명의자가 아니어도 보관자가 될 수 있다는 법리 또는 차량을 빌려 보관하다 매도한 사실을 설명했다.
          3: 김을동에게 차량을 빌려 지배한 사실에 보관자 법리를 적용했으나, 허락 없는 매도가 위탁 취지에 반하는 처분이라는 설명은 없다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
    - title: 공소사실·친족관계·재판형식
      points: 10
      items:
      - id: K-I-3-b
        points: 5
        explanation: 차를 맡긴 사람은 김을동이고, 김갑동에 대한 관계에서 소유자는 회사다. 김을동과 친족이라는 사실만으로 판단을 끝내지 않고, 소유자와 위탁자 모두와 친족이어야 한다는
          요건을 적용했는지 본다.
        criterion: 지입차량은 제3자인 김갑동과의 관계에서 등록명의자인 주식회사 화무의 소유이고, 김을동은 위탁자이자 김갑동의 4촌이다. 횡령죄의 친족상도례는 범인이 소유자와 위탁자 모두와
          친족관계에 있어야 적용되므로, 회사와 친족관계가 없는 이 사건에는 적용되지 않는다고 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 김갑동과 김을동의 친족관계에 따른 친족상도례를 검토해야 한다고 기재했다.
          3: 회사 소유·김을동 위탁의 구별과 소유자·위탁자 모두와의 친족관계 요건 중 하나만 설명하고, 친족상도례가 적용되지 않는다는 결론을 제시했다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 공소기각 결론을 택한 답안도 회사 소유와 소유자·위탁자 모두와의 친족관계 요건을 설명하여 실체법상으로는 친족상도례가 적용되지 않는다는 점을 밝히고, 공소장 기재 때문에 이를
          그대로 적용할 수 없다고 판단했다면 이 항목을 충족한 것으로 본다.
        accept_label: 허용 답안
      - id: K-I-3-c
        points: 5
        explanation: 회사를 실제 소유자로 판단할 수 있는지와 공소장에 적힌 피해자를 바꿀 수 있는지를 나누어 본다. 같은 차량의 같은 처분이라는 점과 이미 회사 소유에 대해 방어할 기회가
          있었다는 기록을 연결한다. 공소기각 대안은 그러한 기회에도 불구하고 남는 구체적 방어상 불이익을 설명해야 한다.
        criterion: 공소장에는 김을동만 피해자로 적혀 있지만 같은 차량의 같은 매도행위여서 공소사실의 동일성이 유지된다고 설명한다. 회사 소유를 인정해도 방어권에 실질적 불이익이 없는 이유를
          기록의 사정에 근거하여 밝히고, 공소장변경 없이 유죄를 인정할 수 있어 김을동의 고소취소는 결론에 영향이 없다고 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 회사 소유를 이유로 유죄 결론을 제시했거나, 공소장의 피해자 기재와 고소취소의 효과를 검토했다.
          3: 회사 소유와 친족상도례 부적용을 근거로 유죄를 제시했으나, 공소사실의 동일성이나 방어권에 실질적 불이익이 없는 사정에 관한 설명이 일부 또는 전부 빠졌다. 또는 실체법상 친족상도례
            부적용과 공소장변경의 일반 요건을 설명하고 공소기각을 구했으나, 방어권의 구체적 불이익에 관한 기록 적용이 부족하다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 유죄 답안에서 방어 기회가 있었다는 근거는 회사 소유를 보여주는 등록원부·지입관계 자료에 증거동의한 사정 또는 변호인이 등록명의 문제를 이미 다툰 사정 등으로 설명할 수 있다.
          동일성과 방어권에 관한 판단을 뒷받침하면 이 사실들을 모두 나열할 필요는 없다. 공소장변경이 필요하므로 고소취소에 따른 공소기각(형사소송법 제327조 제5호)을 해야 한다는 답안도 다음
          논증을 모두 갖추면 만점이다. 회사 소유와 실체법상 친족상도례 부적용을 인정하고, 공소장변경의 일반 요건을 설명하며, 회사 소유에 관하여 이미 방어할 기회가 있었던 사정에도 불구하고
          어떤 추가 방어 준비나 반박 기회가 부족했는지를 기록에 근거해 구체적으로 설명해야 한다. 공소장에 회사가 적혀 있지 않다거나 친족상도례 주장이 배제된다는 사정만으로는 만점이 아니다.
          회사 소유·친족상도례 부적용과 공소장변경 요건까지 설명한 답안은 3점 조건으로, 그런 설명 없이 김을동과의 친족관계나 고소취소만 든 답안은 최대 1점으로 평가한다. 기록에 없는 절차나
          사실을 만들어 방어권 침해를 주장하거나 증거동의가 공소장변경을 대신한다고 설명한 부분은 인정하지 않는다.
        accept_label: 허용 답안
  - id: K-I-4
    title: 김갑동 — 착오이체 비트코인 횡령·예비적 배임
    points: 6
    expected: 횡령과 예비적 배임 모두 무죄.
    reference_sections:
    - Ⅰ. 김갑동에 대한 검토의견서 / 3. 횡령의 점 / 나. 비트코인의 임의 사용과 예비적 배임
    sections:
    - title: 공소장 변경 후 주위·예비적 공소사실
      points: 6
      items:
      - id: K-I-4-a
        points: 3
        explanation: 경제적 가치가 있다는 것과 횡령죄의 재물에 해당한다는 것은 별개의 판단이다. 비트코인이 재물이 아니라는 이유를 주위적 횡령의 무죄 결론에 연결했는지 확인한다.
        criterion: 비트코인은 재산상 이익으로 볼 수 있으나 횡령죄의 객체인 재물에 해당하지 않으므로 주위적 횡령은 범죄가 되지 않아 무죄라고 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 비트코인 사용에 대한 횡령죄의 무죄 결론을 제시했다.
          2: 비트코인은 횡령죄의 재물이 아니라고 설명했으나, 이 때문에 주위적 공소사실이 범죄가 되지 않는다는 판단은 제시하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-I-4-b
        points: 3
        explanation: 잘못 받은 가상자산을 돌려줄 민사상 의무만으로 상대방의 사무를 맡은 사람이 되는 것은 아니라는 구별을 본다. 금전의 착오송금 법리를 이 사건에 그대로 확장할 수 없는
          이유와 예비적 배임의 무죄 결론을 함께 확인한다.
        criterion: 원인 불명의 착오이체로 가상자산을 받은 사람과 전송자 사이에 민사상 반환의무만으로 배임죄의 신임관계·타인의 사무가 생기지 않는다. 금전 착오송금 법리의 불리한 유추도
          경계하여 예비적 배임을 무죄로 판단한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 예비적 배임이 무죄이거나 김갑동이 타인의 사무를 처리하는 사람이 아니라고 판단했다.
          2: 민사상 반환의무만으로 최부자를 위한 형사상 신임관계가 생기지 않는다고 설명했다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: “죄형법정주의”나 “유추금지”라는 명칭을 생략해도 금전 착오송금의 법리를 가상자산에 불리하게 확장할 수 없다는 이유를 설명하면 인정한다.
        accept_label: 허용 답안
- id: K-II
  title: 이을남 변론요지서
  points: 60
  issues:
  - id: K-II-1
    title: 이을남 — 특수절도
    points: 30
    expected: 실행 전 공모관계 이탈 및 적법한 증거의 부족을 근거로 무죄 변론.
    reference_sections:
    - Ⅱ. 이을남에 대한 변론요지서 / 1. 특수절도의 점
    sections:
    - title: 방어 법리와 기록 적용
      points: 5
      items:
      - id: K-II-1-a
        points: 5
        explanation: 처음 망보기 제안을 받아들인 사실과 실제 절도 실행에 가담했는지는 구별한다. 손전등으로 살피는 단계에서 떠나겠다고 알리고 실제 떠난 사실이 실행 전 이탈과 자신의
          기여 철회에 연결되는지 본다.
        criterion: 일단 망보기 제안을 수락했더라도 실행 착수 전 공모관계에서 이탈하여 기능적 행위지배가 해소되면 이후 범행의 공동정범 책임을 지지 않는다. 손전등으로 차량을 살피는 단계와
          문을 열어 절취하는 단계를 구별하고, 비주도적인 이을남의 이탈 의사표시와 현장 이탈을 정목격 진술에 연결한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 이을남이 공모에서 이탈했거나 절도에 가담하지 않았다고 주장했다.
          3: 실행 전에 이탈하여 공동정범 책임을 지지 않는다는 법리를 이을남이 떠난 사실에 적용했다. 다만 차량을 살피는 단계와 문을 열어 절취하는 단계의 구별, 또는 이탈 의사표시·현장 이탈로
            망보기 기여를 거둔 점을 설명하지 않았다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 공동 가담의 증명이 부족하다는 주장을 먼저 하고 실행 전 이탈을 추가 이유로 제시해도 인정한다. 처음부터 망보기 제안을 수락한 적이 없었다고 기록의 사실을 바꾸어서는 안 된다.
        accept_label: 허용 답안
    - title: 증거능력
      points: 13
      items:
      - id: K-II-1-b
        points: 3
        explanation: 김갑동의 경찰 조서를 이을남의 유죄 증거로 쓸 수 있는지 본다. 이을남이 공범의 진술 내용을 부인하여 증거로 사용할 수 없다는 판단을 확인한다. 진술을 믿기 어렵다는
          설명만 있으면 증명력 항목에서 평가한다. 조문 번호만이 아니라 내용 부인과 증거 배제의 연결을 본다.
        criterion: 김갑동의 경찰 피의자신문조서는 공범인 이을남이 내용을 부인하므로 형사소송법 312조 3항에 따라 이을남의 유죄 증거로 사용할 수 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 경찰 피의자신문조서의 증거능력을 부정했다.
          2: 내용 부인으로 형사소송법 제312조 제3항의 요건을 갖추지 못한다고 설명했으나, 이을남이 공범 김갑동의 조서 내용을 부인한 경우에도 적용된다는 점을 설명하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-II-1-c
        points: 3
        explanation: 검사 대질조서 중 이을남이 부인한 김갑동의 진술 부분을 유죄 증거로 사용할 수 없는지 판단한다. 이을남 본인의 진술 부분과 구별해야 한다. 진술을 믿기 어렵다는 설명만
          있으면 증명력 항목에서 평가하며, 조문 번호만이 아니라 내용 부인과 증거 배제의 연결을 본다.
        criterion: 검사 작성 대질 피의자신문조서 중 김갑동의 진술 부분은 이을남이 내용을 부인하므로 형사소송법 제312조 제1항(2020. 2. 4. 개정, 2022. 1. 1. 시행)에
          따라 증거능력이 없다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 검사 작성 대질 피의자신문조서의 증거능력을 부정했다.
          2: 이을남의 내용 부인과 제312조 제1항에 따라 증거능력을 부정했으나, 판단 대상이 대질조서 중 김갑동의 진술 부분임을 구별하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-II-1-d
        points: 4
        explanation: 문제는 화상이라는 방식 자체가 아니라 선서 등 필요한 증인신문절차를 거치지 않았다는 점이다. 같은 진술을 녹음하거나 조서로 옮겨도 하자가 없어지지 않고, 당사자의
          동의만으로 보완되지 않는다는 설명까지 확인한다.
        criterion: 최외국의 해외 화상 진술은 선서 없이 법관이 임의 청취한 것으로 적법한 증인신문절차를 거치지 않았다. 이를 변형한 조서·녹음 등도 증거로 쓸 수 없고 당사자 동의나 이의
          없음만으로 하자가 치유되지 않는다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
