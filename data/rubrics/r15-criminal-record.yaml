  scope:
  - I 김갑동 검토보고서 본론
  - II 이을남 변론요지서 본론
  - 공소사실 요약과 양형 의견은 제외하며 법리·증거와 소송조건을 검토한다.
  - 허용된 문서 간 원용을 인정한다. 대법원 입장과 다른 견해는 그 이유와 적용을 밝혀야 한다.
  - 기록 말미의 개정 형법 제328조와 부칙을 확인하며 종전 법률 문구만 기계적으로 적용하지 않는다.
  grading_rules:
  - 각 항목에서 만점·부분점수 조건을 여러 개 충족하면 가장 높은 점수 하나를 부여한다. 허용 답안, 점수 상한, 중복 감점 방지의 개별 규칙을 함께 적용한다. 조건에 없는 타당한 해법이나 미결 판단은
    점수를 임의로 확정하지 않고 검토 대상으로 남긴다.
  - 검토보고서 40점과 변론요지서 60점을 따로 합산한다. 보고서는 객관적 유·무죄 및 소송조건 판단, 변론요지서는 기록에 근거한 피고인 방어를 평가한다.
  - 법령·판례는 기록의 답안 작성일인 2026. 1. 7.을 기준으로 한다. 각 행위에 적용되는 법령과 부칙을 확인하고 문제에서 제시한 법령과 적용 조건을 따른다. 작성일 뒤에 개정되거나 선고된 법령·판례는
    채점 근거로 쓰지 않는다.
  - 증거능력과 증명력은 분리한다. 같은 조서라도 피고인·진술자·입증대상·증거의견을 구별한다.
  - 문제에서 허용한 문서 간 원용은 원용 대상이 식별되고 사건별 차이를 적용하면 직접 서술과 같은 점수를 부여한다. 원용된 법리로 서로 다른 판단을 한 경우 각각 해당 항목에서 평가한다.
  - 고소 취소·공소시효·재판형식은 각각 명시된 항목에서 채점한다. 죄명 제목만 맞힌 것에 자동 점수를 주지 않는다.
  - 반대 견해는 문제 지시에 따라 대법원 입장과 다른 이유를 밝히고 기록에 적용한 경우 검토 대상으로 남긴다. 이미 허용된 대안 외 새로운 견해는 자동 0점 또는 자동만점으로 정하지 않고 재검토한다.
  - 공소사실 요약과 양형 의견은 작성범위 밖이다. 서술 순서·보고서의 개조식 여부·교재 표현 일치에 별도 점수를 주지 않는다.
