    title: 이을남 — 전자기록등내용탐지
    points: 8
    expected: 비밀장치 요건 미충족을 지적하되 고소기간 도과에 따른 공소기각을 우선 제시.
    reference_sections:
    - Ⅱ. 이을남에 대한 변론요지서 / 3. 전자기록등내용탐지의 점
    sections:
    - title: 실체·소송조건
      points: 8
      items:
      - id: K-II-3-a
        points: 3
        explanation: 알아낸 정보가 비밀번호라는 사실과, 그 정보를 담은 기록에 비밀장치가 있다는 사실은 다르다. 아이디·비밀번호도 전자기록이지만 이 사건에는 그 기록 자체의 비밀장치가
          인정되지 않는다는 설명을 확인한다.
        criterion: 키로그 프로그램으로 얻은 아이디·비밀번호는 전자기록에 해당하지만, 형법 316조 2항은 비밀장치한 전자기록을 대상으로 한다. 기록의 노트북에 비밀번호·화면보호기 등 보안이
          없고 해당 기록에 별도 비밀장치가 인정되지 않아 구성요건이 충족되지 않음을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 전자기록등내용탐지죄가 성립하지 않는다고 판단했다.
          2: 노트북이나 탐지한 기록에 비밀장치가 없다는 사실을 적용했으나, 탐지한 내용이 비밀번호라는 사실과 그 기록 자체에 비밀장치가 있다는 요건을 같은 것으로 설명했다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: ‘아이디·비밀번호는 전자기록이 아니므로 불성립’이라는 이유만 든 답안에는 만점을 주지 않는다. 대법원은 이를 전자기록으로 본다. 판례의 입장을 밝히고 다른 견해를 논증한 답안은
          반대 견해 규칙에 따라 검토 대상으로 남긴다.
        accept_label: 채점 유의사항
      - id: K-II-3-b
        points: 3
        explanation: 여기서 보는 기간은 범인을 안 날부터 고소할 수 있는 6개월이다. 2월 11일에 범인을 알고 8월 31일에 고소한 두 날짜를 기준에 적용한다. 범죄의 공소시효와 혼동하지
          않았는지도 확인한다.
        criterion: 친고죄(형법 318조)의 고소기간은 범인을 안 날부터 6개월이다. 박주인은 2025. 2. 11. 범인을 알고 8.31. 고소했으므로 기간이 지났음을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 고소기간이 지났다고 판단했다.
          2: 고소기간이 지났다는 결론과 “범인을 안 날부터 6개월”이라는 기준 또는 2월 11일 인지·8월 31일 고소의 날짜를 제시했으나, 기준과 두 날짜를 모두 갖추지는 못했다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
      - id: K-II-3-c
        points: 2
        explanation: 적법한 고소가 없다는 절차상 문제와 범죄의 구성요건이 부족하다는 실체상 문제를 구별한다. 공소기각을 구하는 것이 기준이며, 공소기각 원칙과 사유를 밝힌 뒤 무죄를
          먼저 구하는 허용 답안도 인정한다.
        criterion: 부적법한 고소로 공소제기절차가 무효이므로 327조 2호 공소기각을 우선 구하고, 실체상 무죄 논거와 재판의 순서를 구별한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 실체상 무죄를 주장했으나 고소기간 문제에 따른 공소기각을 검토하지 않았다. 또는 무죄와 공소기각을 모두 언급했으나 어떤 재판을 먼저 구하는지 설명하지 않았다. 또는 공소기각이 원칙임을
            밝히지 않은 채 무죄를 먼저 구했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 공소기각이 원칙임과 그 사유(고소기간 경과)를 밝힌 뒤, 실체심리가 끝났으므로 피고인의 이익을 위해 무죄를 먼저 구한 답안도 변론요지서의 선택으로 보아 만점으로 인정한다.
          공소기각을 구하면서 실체상 무죄 사유를 함께 주장한 답안은 기준대로 채점한다. 무죄만 구한 답안은 최대 1점이다.
        accept_label: 허용 답안
