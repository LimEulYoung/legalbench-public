  - id: P-II-2
    title: ④ 대상적격·원고적격·제소기간
    points: 12
    expected: 취소재결 및 철거명령을 대상으로 한 구민호의 소는 2026.2.5. 제기하면 적법.
    sections:
    - title: 허용된 소송요건
      points: 12
      items:
      - id: P-II-2-a
        points: 4
        criterion: 원처분 중심주의와 재결 고유 위법의 예외를 설명한다. 제3자 학부모의 심판청구를 인용하여 원고에게 유리한 제외처분을 취소한 형성재결은 재결 자체가 쟁송대상이다. 철거명령은
          별도 구체적 철거의무를 부과하는 처분이다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 재결과 철거명령 모두 취소소송의 대상이라고 결론을 제시했다.
          2: 철거명령이 별개의 의무를 부과하는 처분이라고 설명했다. 또는 재결이 구민호에게 불이익을 주었다고 설명했으나, 원처분 중심주의의 예외로 재결을 다툴 수 있는 이유는 설명하지 않았다.
          3: 원처분 중심주의와 재결 고유 위법의 예외를 설명하고, 제3자의 심판청구로 유리한 제외처분이 취소된 사안에 적용했다. 철거명령이 별도 의무를 부과하는 처분이라는 설명은 없다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 대상적격은 취소소송에서 무엇을 다툴 수 있는지에 관한 문제다. 유리했던 제외처분이 제3자의 심판청구로 취소되어 불이익이 생겼으므로 그 재결 자체를 다투는 이유와,
          철거명령이 별도 의무를 발생시키는 이유를 구별한다. 별도 의무에 대한 설명이 원고적격 문단에 있어도 철거명령을 설명한 것이 분명하면 인정한다.
      - id: P-II-2-b
        points: 3
        criterion: 구민호는 재결로 수익적 지위를 박탈당하고 철거명령의 직접 상대방이므로 법률상 이익이 있다. 원처분청은 인용재결의 기속력 때문에 그 재결에 불복하는 공동원고가 될 수 없다고
          설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 구민호에게 원고적격이 있다는 결론을 제시했다.
          2: 제외시설의 지위 상실과 철거명령의 직접 상대방이라는 점에서 구민호의 법률상 이익을 설명했으나, 교육장이 인용재결에 불복하는 공동원고가 될 수 없는 이유는 설명하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 원고적격은 누가 이 소송을 제기할 이익이 있는지를 묻는다. 구민호의 제외시설 지위 상실과 철거 의무를 확인하고, 교육장은 인용재결에 따라야 하므로 이를 다투는 공동원고가
          될 수 없다는 이유까지 설명했는지 본다.
      - id: P-II-2-c
        points: 5
        criterion: 재결을 안 날을 2025. 11. 7.로 보는 송달 또는 전화 통보의 근거와 철거명령을 받은 날인 12. 24.를 구별한다. 각각의 90일 기간에서 초일을 제외하고,
          두 청구를 함께 제출할 마지막 날이 재결의 제소기간이 끝나는 2026. 2. 5.임을 설명한다. 철거명령의 기간도 이 날까지 남아 있음을 별도로 확인한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 처분 등이 있음을 안 날부터 90일 안에 제기해야 한다고 기재했다.
          2: 재결과 철거명령의 송달일을 구별하고 한쪽의 90일 기간을 맞게 계산했다.
          3: 각 송달일의 다음 날부터 90일을 계산해야 한다고 설명했으나, 만료일 계산에 오류가 있거나 두 청구를 함께 제기할 마지막 날로 더 늦은 날을 택했다.
          4: 공동 제출의 마지막 날을 2026. 2. 5.로 맞게 정했으나, 11. 7.을 재결을 안 날로 보는 송달·전화 통보의 이유 또는 철거명령의 별도 송달일에 따른 90일 기간이 공동
            제출일까지 남아 있다는 설명을 빠뜨렸다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 구민호는 학부모들이 청구한 행정심판의 참가인이다. 그 지위에서 재결서 등본을 받은 날을 재결을 안 날로 설명한 답안을 인정한다. 모친이 같은 날 전화로 재결 내용을 알려 주어
          원고가 그날 실제로 알았다고 설명한 답안도 보충송달에 따른 설명과 같은 점수로 인정한다. 11월 8일에 비로소 재결이 있음을 알았다고 보아 제소기간을 하루 늦추는 설명은 인정하지 않는다.
          11월 7일을 재결을 안 날로 보고, 초일 불산입에 따라 11월 8일부터 90일을 계산하는 설명은 인정한다. 두 행위의 송달일이 같다고 가정한 설명은 인정하지 않는다. 철거명령의 개별
          만료일을 2026. 3. 24.로 산정한 경로를 인정한다. 두 행위에 각각 90일이 적용되고 철거명령은 더 늦은 12. 24.에 송달되어 재결 만료일인 2. 5.까지 그 기간도 남아
          있다고 설명한 경로도 5점이다. 후자의 경우 3. 24.라는 날짜 자체를 기재하지 않았다는 이유로 감점하지 않는다. 작성일에 2. 5.만 적고 이러한 기간 관계를 설명하지 않은 것은
          이 허용 경로에 해당하지 않는다.
        accept_label: 채점 유의사항
        explanation: 날짜를 세 단계로 확인한다. 첫째, 재결은 모친 수령 또는 같은 날 전화 통보 때문에 11월 7일에 안 것으로 본다. 둘째, 그 다음 날부터 90일인 2월 5일이
          재결의 마지막 날이다. 셋째, 철거명령은 별도로 12월 24일에 알려졌으므로 같은 90일 기간이 더 늦게 끝난다. 철거명령의 종기 3월 24일을 계산하거나, 그 별도 기간이 2월 5일까지
          남는다고 설명하면 된다.
    reference_sections:
    - Ⅱ. 행정소장 / ④ 이 사건 소의 적법성
  - id: P-II-3
    title: ⑤ 취소재결·철거명령의 위법
    points: 25
    expected: 기록에 기초한 재량심사, 사실오인·평등·비례 및 철거 전제의 상실을 논증.
    sections:
    - title: 재결의 위법
      points: 15
      items:
      - id: P-II-3-a
        points: 4
        criterion: 법규의 문언·체계·행위 성질에 따른 재량 판단 기준을 제시한다. 교육환경법 9조단서의 학습환경 영향 평가와 10조 1항의 철거 불가피성·명할 수 있다는 규정에 재량을
          인정하고, 법원은 사실오인·평등·비례 등 일탈·남용을 심사한다고 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 제외처분이나 철거명령이 재량행위라는 결론을 제시했다.
          2: 법률의 문언·행위 성질에 따른 재량 판단 또는 재량권 일탈·남용의 심사를 두 조치 중 하나에 적용했다.
          3: 학습환경 영향 평가와 철거의 불가피성 판단에 재량이 있다고 설명했으나, 법원이 사실오인·평등·비례 위반을 심사한다는 설명은 없다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: “판단여지”라는 용어를 써도 법원의 심사를 배제하지 않고 사실오인·평등·비례 위반 등 통제기준을 설명하면 인정한다.
        accept_label: 허용 답안
        explanation: 재량은 법이 여러 사정을 평가하여 선택할 여지를 행정청에 준다는 뜻이다. 제외 여부에는 학습환경 영향 평가, 철거에는 불가피성 판단이 필요하다. 법원은 그 선택에
          사실오인·평등·비례 위반이 있는지 심사한다. 일반론이 부족해도 실제 처분에 이러한 심사를 적용한 경우에는 2점 조건부터 확인한다.
      - id: P-II-3-b
        points: 6
        criterion: 학습환경 위해 판단에 관한 사실오인·사유 부존재를 논증한다. 독립 사실군은 ①학교·주 통학로에서 건물·출입구가 보이지 않음 및 학생 8%만 통행, ②성인물 분리·안내문·밀실
          부재라는 운영관리, ③유해인식도 변화·만화카페 제외 개정안이다. 이를 재결의 추상적 오락성·중독성 판단과 비교한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 위치·통학로, 운영관리, 인식 변화 중 한 사실군을 학습환경 위해 판단에 적용했다.
          4: 서로 다른 두 사실군을 구체적으로 적용하여 학습환경 위해 판단을 반박했다.
          6: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 서로 다른 세 사실군을 위해 판단에 적용하면 6점이다. 두 사실군만 사용해도 재결이 제시한 오락성·중독성의 이유까지 직접 반박하면 6점이다. 개정안은 시행 중인 법률로 취급하지
          않고 인식 변화를 뒷받침하는 자료로 사용한다.
        accept_label: 만점 조건
        explanation: 사실의 개수보다 서로 다른 방향의 근거를 본다. 학교에서 보이지 않는 점과 학생 8%의 통행은 모두 위치·통학로라는 한 사실군이다. 성인물 분리와 밀실 부재는 운영관리라는
          다른 사실군이다. 기록 사실을 나열한 뒤 위해성 판단에 어떻게 영향을 주는지도 설명해야 한다.
      - id: P-II-3-c
        points: 5
        criterion: 평등원칙상 비교가능성과 합리적 차별 사유를 검토한다. 같은 건물의 당구장이 2025.1. 제외처분 후 영업 중이고 조사상 유해인식은 더 높은데 만화카페만 제외처분이 취소된
          점을 들어 차별의 불합리성을 논증한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평등원칙 위반이라는 결론을 제시했다.
          3: 같은 건물의 당구장은 허용하면서 만화카페만 배제한 사실을 들었으나, 비교 가능한 시설인 이유 또는 더 높은 당구장 유해인식에도 달리 취급할 합리적 이유가 없는 점을 설명하지 않았다.
          5: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: “자기구속”이라는 용어를 생략해도 시설의 비교가능성과 차별의 합리성을 설명하면 인정한다. 재결청과 제외처분을 한 교육장을 같은 기관이라고 가정할 필요는 없다. 참고법령상 당구장은
          청소년 출입·고용금지업소이고 만화대여업은 청소년고용금지업소여서 청소년의 출입 가능성이 다르다. 이 차이를 합리적 차별 사유의 후보로 검토한 뒤, 성인물 분리 진열·연령 안내, 위치,
          유해인식도 등 기록에 근거하여 그 차이만으로 달리 취급할 정도의 위해가 인정되는지 다툰 답안도 인정한다. 이 차이를 다루지 않았다는 이유만으로 감점하지 않는다.
        accept_label: 허용 답안
        explanation: 비교 대상은 같은 건물에서 제외처분을 받아 영업하는 당구장이다. 같은 위치·환경에서 두 시설을 달리 취급할 이유가 있는지, 당구장의 유해인식도가 더 높은 조사와 어떻게
          양립하는지 설명했는지 본다. 청소년 출입 가능성의 차이에 관한 반론과 재반박은 허용되는 보충 논증이며 반드시 추가해야 하는 만점 요소는 아니다.
    - title: 철거명령의 위법
      points: 10
      items:
      - id: P-II-3-d
        points: 3
        criterion: 철거명령은 제외시설이 아니라는 전제에서 발해졌다. 재결이 취소되면 제외처분의 지위를 회복하여 철거의 전제가 무너진다는 연결을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 재결이 위법하므로 철거명령도 위법하다는 결론을 제시했다.
          2: 기존 제외처분에 따른 법적 지위 때문에 철거 대상에서 빠진다는 관계는 설명했으나, 재결이 취소되어야 그 지위가 회복된다는 단계를 빠뜨리거나 취소 전부터 제외시설의 지위가 유지·회복된
            것처럼 적었다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 재결이 취소되면 철거명령의 전제(제외시설이 아니라는 점)가 소급하여 사라진다는 연결을 설명하면 된다. ‘제외처분의 지위 회복’이라는 표현 없이, 철거명령이 재결의 유효를 전제로
          하므로 재결이 취소되면 그 기초를 잃는다고 설명해도 같은 점수다. ‘위법한 재결을 전제로 한 철거명령도 위법하다’는 결론만 쓴 답안은 1점이다. 모든 선행·후행 처분에 하자가 승계된다는
          일반론은 요구하지 않는다. 위법한 재결은 취소 전에도 당연무효라고 한 설명은 인정하지 않는다. 기존 제외처분을 언급했더라도 결론이 단지 카페의 실제 위해성이 낮다는 것이라면 법적 지위의
          회복을 설명한 것으로 보지 않는다. 2점은 제외처분에 따른 법적 지위와 철거 대상의 관계까지 설명한 경우에 적용한다.
        accept_label: 채점 유의사항
        explanation: 여기서는 카페가 실제로 덜 유해한지와 별개로 법적 지위를 본다. 제외처분은 원래 금지되는 시설에서 이 카페를 빼 준 결정이고, 재결은 그 제외를 취소했다. 재결이
          법원에서 취소되면 제외시설 지위가 되살아나 철거 대상에서 빠진다는 연결을 확인한다. 이 순서를 생략한 법적 지위 주장과, 단순한 위해성 주장 또는 위법의 결론을 구별한다.
      - id: P-II-3-e
        points: 7
        criterion: 철거명령 자체의 비례원칙 위반을 논증한다. 실제 위해성에 비추어 철거가 불가피한지와 영업정지·성인물 관리 등 덜 침익적인 수단을 검토한다. 교육환경 보호의 공익과 철거로
          생기는 구체적 손해를 비교하여 철거가 과도하므로 취소되어야 한다고 설명한다. 장기간 영업·학교의 후발 개교·미상환 개업대출·노모 부양·유일한 생계수단 상실은 활용할 수 있는 사정의 예다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 장기간 영업, 미상환 대출, 노모 부양 등 구체적 손해 사실을 들어 철거가 과도하다고 설명했으나, 교육환경 보호의 공익과 비교하지 않았다.
          4: 교육환경 보호의 공익과 구체적 손해를 비교하여 철거가 과도한 이유를 설명했으나, 대체수단·철거 불가피성에 대한 검토가 부족하다.
          6: 대체수단·철거 불가피성을 검토하고 공익과 구체적 손해를 비교했으나, 그 이유로 철거명령이 비례원칙에 위반하여 취소되어야 한다는 결론을 제시하지 않았다.
          7: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 앞에서 설명한 위해성 자료를 인용할 수 있지만, 전면 철거가 필요한지와 철거로 생기는 손해는 따로 설명해야 한다. 재결에 대해서도 비례 위반을 주장할 수 있으나, 같은 논증의
          반복에 별도 가점을 주지는 않는다. 손해 사정의 개수를 정해 요구하지 않으며 예를 모두 나열할 필요도 없다. 구체적 손해 하나를 충분히 설명해 공익과 비교한 답안도 인정한다. 실제 위해성이
          낮아 철거로 얻는 추가적인 공익은 작다는 설명과, 구체적 손해 때문에 철거가 지나치다는 설명이 연결되어 있으면 공익·사익이라는 용어나 별도 형량 소제목이 없어도 인정한다. 기록의 사실
          적용 없이 공익은 작고 사익은 크다고만 쓴 것은 구체적인 비교로 인정하지 않는다.
        accept_label: 채점 유의사항
        explanation: 공익은 학생의 학습·교육환경 보호이고, 사익의 손해는 투자금·대출 회수와 가족의 생계 등이다. 위험이 작거나 다른 조치로 보호 목적을 달성할 수 있는데도 전면 철거로
          큰 손해를 준다는 연결이 비교에 해당한다. 손해만 나열한 경우와 구별한다. 만점에는 대체수단·철거 불가피성, 구체적 사실에 근거한 공익과 손해의 비교, 철거명령 취소 결론이 필요하다.
          손해 사실의 개수로 점수를 정하지 않는다.
    reference_sections:
    - Ⅱ. 행정소장 / ⑤ 이 사건 처분 등의 위법성
