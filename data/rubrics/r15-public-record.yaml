  scope:
  - I 헌법소원심판청구서①~⑥
  - II 행정소장①~⑧
  - 헌법소원은 직접성·현재성과 지정된 위헌 논거, 행정소장은 대상적격·원고적격·제소기간 및 지정된 위법 논거만 평가한다.
  - 헌법소원은 의뢰인에게 유리한 합리적 위헌 주장. 행정소장에는 두 처분을 함께 제소할 수 있는 기간 내 최종일을 기재한다.
  - 가상 참고법령 우선, 기록상 사실 전제, 경어체 및 지정 양식 사용.
  grading_rules:
  - 각 항목에서 만점·부분점수 조건을 여러 개 충족하면 가장 높은 점수 하나를 부여한다. 허용 답안, 점수 상한, 중복 감점 방지의 개별 규칙을 함께 적용한다. 조건에 없는 타당한 해법이나 미결 판단은
    점수를 임의로 확정하지 않고 검토 대상으로 남긴다.
  - 헌법소원 50점·행정소장 50점. 답안의 지정 양식 번호를 기본 단위로 하되 동일 쟁점 안의 논증은 함께 평가한다.
  - 기록의 가상 법령이 현행 실정법보다 우선한다. 군형법이나 실제 지역 관할로 기록을 대체하지 않는다.
  - 헌법소원의 직접성·현재성, 행정소장의 대상적격·원고적격·기간만 적법요건으로 평가한다. 배제된 법리의 장황한 서술에 별도 점수는 없다.
  - 헌법소원은 의뢰인에게 유리한 합리적 위헌 주장을 평가한다. 관련 실제 결정의 합헌 다수의견을 그대로 정답 결론으로 강제하지 않는다.
  - 각 기본권을 표시한 양식란과 본문의 제한·위헌 논증은 작성 기능이 다르다. 권리명만 반복하면 본문 적용 점수가 생기지 않는다.
  - 집단 진정은 P-I-1-c·P-I-3-a에서 정한 청원권 대안으로도 평가한다. 이 대안을 택해도 직접성·현재성 및 과잉금지 논증의 점수 조건은 같다. 정치단체 결성 관여는 정치적 표현의 자유로
    평가하며 두 쟁점의 기본권을 혼동하지 않는다.
  - 경어 사용, 양식 외 서술, 제외된 주장 등은 관련 항목의 명시된 조건에서만 처리한다. 새 총점 감점이나 문체 가점을 임의로 만들지 않는다. 경어를 쓰지 않은 답안은 감점하지 않고 판단 이유에만
    적는다.
  - 기준답안의 문장을 수험 답안의 인용 근거로 사용하지 않는다.
  id: r15-public
documents:
- id: P-I
  title: 헌법소원심판청구서
  points: 50
  issues:
  - id: P-I-1
    title: 헌법소원 양식 ①·②·⑤·⑥
    points: 11
    expected: 쟁점에 한정한 위헌확인을 구하고 각 행위에 관한 기본권, 적절한 첨부서류와 헌법재판소를 기재.
    sections:
    - title: 청구취지·권리·첨부·제출처
      points: 11
      items:
      - id: P-I-1-a
        points: 3
        criterion: ① 「군인의 지위 및 복무에 관한 기본법」 제31조 제1항 제5호 중 부사관에 관한 부분을 특정하여 위헌확인을 구한다. 군무 고충의 집단 진정·서명 범위에 한정하고 조문의
          개정연혁을 쓰지 않는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 군인복무기본법 제31조의 집단행위 금지를 다투었으나, 제1항 제5호 또는 부사관에 관한 부분이라는 한정을 빠뜨리거나 잘못 적었다.
          2: 제31조 제1항 제5호의 부사관 부분을 다투었으나, 법률명을 약칭으로 적거나 기재하지 말라고 한 개정연혁을 적었다. 또는 위헌확인을 구하는 주문의 형식을 잘못 적었다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 청구취지는 헌법재판소에 어떤 조항의 위헌확인을 구하는지 적는 부분이다. 법률명·조항과 부사관에 관한 부분이라는 한정을 확인한다. 개정연혁을 쓰지 말라는 지시는 청구취지
          ①에 한정된다. 위헌 이유에서 종전 규율과 현 조항을 비교한 것은 이 지시 위반이 아니다.
      - id: P-I-1-b
        points: 3
        criterion: ① 같은 법 제33조 제1항 및 「국가공무원법」 제65조 제1항 중 “그 밖의 정치단체의 결성에 관여”하는 부분을 대상으로 위헌확인을 구한다. 정당·가입·별도 징계와
          벌칙 조항을 청구대상에서 제외한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 군인복무기본법 제33조 제1항과 국가공무원법 제65조 제1항 중 한 조항만 청구대상으로 특정했다.
          2: 두 조항을 청구대상으로 특정했으나, 결성 관여 부분으로 한정하지 않았거나 법률명을 잘못 적었다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 조문이 “정당이나 그 밖의 정치단체의 결성에 관여하거나 이에 가입할 수 없다”이므로, 청구취지에 “그 밖의 정치단체” 부분이라고만 적으면 가입 금지까지 청구대상에 포함된다.
          작성 지시는 내부회의록의 전략(가입 제외)을 청구취지에 반영하라고 했으므로, 청구이유에서 결성 관여만 다투었더라도 이런 답안은 최대 2점이다.
        accept_label: 채점 유의사항
        explanation: 두 법률에서 다투는 범위는 정치단체의 결성에 관여하는 행위다. 단체에 가입하는 행위까지 포함한 청구인지 청구취지 자체에서 확인한다. 본문에서 결성 관여만 설명했다고
          하여 넓게 쓴 청구취지가 자동으로 좁아지는 것은 아니다.
      - id: P-I-1-c
        points: 2
        criterion: ② 집단 진정·서명은 헌법 제21조 제1항의 표현의 자유 또는 제26조의 청원권으로 특정하고, 정치단체 결성 관여는 정치적 표현의 자유로 특정한다. 각 쟁점에서 하나의
          기본권을 선택하며 결사의 자유·평등권 등 배제하기로 한 기본권을 독립 쟁점으로 추가하지 않는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 한 쟁점의 기본권만 맞게 특정했다. 또는 기본권을 적었으나 각 행위와의 관계를 구별하지 않았거나 작성 지시에서 제외한 결사의 자유·평등권을 독립 쟁점으로 추가했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: “표현의 자유”라는 하나의 명칭으로 집단 진정과 정보제공을 모두 설명해도 2점이다. 집단 진정은 청원권으로, 정치단체 결성 관여는 표현의 자유로 각각 특정한 답안도 2점이다.
          헌법 조문번호를 생략한 것은 감점하지 않는다. 청원권의 보호영역·제한에 관한 본문 논증은 P-I-3-a에서 평가한다.
        accept_label: 허용 답안
        explanation: 여기서는 각 행위에 관하여 침해되는 권리를 식별했는지 본다. 집단 진정·서명에는 표현의 자유와 청원권 중 하나를, 정치단체 결성 관여에는 표현의 자유를 연결한다.
          왜 그 행위가 보호되고 제한되는지에 관한 본문 논증은 뒤의 해당 항목에서 평가한다.
      - id: P-I-1-d
        points: 2
        criterion: ⑤ 기록에 있는 대리인선임서와 담당변호사지정서를 변호사강제주의 관련 첨부서류로 기재한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 대리인선임서와 담당변호사지정서 중 하나만 기재했다. 또는 두 서류를 기재하면서 작성 지시와 무관한 첨부서류를 추가했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 양식에 인쇄된 “각종 입증서류”를 그대로 둔 것은 불필요한 서류를 새로 추가한 것으로 보지 않는다.
        accept_label: 채점 유의사항
        explanation: 기록에 있는 선임·지정 서류를 실제로 기재했는지 확인한다. 변호사강제주의라는 법률 용어를 첨부서류 목록에 덧붙일 필요는 없다.
      - id: P-I-1-e
        points: 1
        criterion: ⑥ 제출처를 헌법재판소로 기재한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
    reference_sections:
    - Ⅰ. 헌법소원심판청구서 / ① 청구취지
    - Ⅰ. 헌법소원심판청구서 / ② 침해된 권리
    - Ⅰ. 헌법소원심판청구서 / ⑤ 첨부서류
    - Ⅰ. 헌법소원심판청구서 / ⑥ 제출처
  - id: P-I-2
    title: ③ 직접성·현재성
    points: 8
    expected: 법률 자체에 의한 금지와 구체화된 계획에 따라 두 요건 모두 충족.
    sections:
    - title: 법령 헌법소원의 적법요건
      points: 8
      items:
      - id: P-I-2-a
        points: 4
        criterion: 직접성은 별도 집행행위 없이 법규범 자체가 자유를 제한하는 경우이다. 두 금지규정 자체가 계획한 집단 진정·정보제공을 제한하고, 징계나 형사처벌 위험을 실제로 감수한
          뒤에야 다투도록 할 수 없음을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 직접성이 인정된다는 결론을 제시했다.
          2: 법령 자체가 기본권을 제한한다는 법리를 설명하고, 집단 진정 또는 정보제공 중 한 행위에 적용했다.
          3: 두 행위 모두 법령 자체로 제한된다고 설명했으나, 실제 징계나 형사처벌을 기다리지 않고 헌법소원을 제기할 수 있는 이유는 설명하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 직접성은 규정 자체가 지금 하려는 행위를 막는지를 묻는다. 단순히 처벌될 수 있다고 쓴 것과, 처벌받을 위험을 먼저 감수해야만 다툴 수는 없다고 설명한 것을 구별한다.
          두 계획행위에 금지가 바로 미친다는 설명까지 있으면 3점 조건을 확인한다.
      - id: P-I-2-b
        points: 4
        criterion: 현재성의 원칙과 확실히 예측되는 장래 침해의 예외를 설명한다. 2025.11. 구체적 진정·면담 계획과 12.10. 상관 경고 때문에 이미 표현이 위축되거나 가까운 장래
          침해가 확실하여 현재성을 인정한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 현재성이 인정된다는 결론을 제시했다.
          2: 현재의 침해를 요구하는 원칙과 확실한 장래 침해의 예외를 설명했다. 또는 진정·면담 계획과 상관의 경고 사실을 현재성 판단의 근거로 제시했다.
          3: 진정·면담 계획과 금지규정의 효과를 연결했으나, 이미 표현이 위축되었는지 또는 장래 침해가 확실히 예상되는 이유를 설명하지 않았다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 현재 표현이 위축되었다는 설명과 장래 침해가 확실히 예측된다는 설명 중 하나를 사실에 근거해 논증하면 4점이다. 기록에 없는 징계처분을 실제로 받았다고 가정한 설명은 인정하지
          않는다.
        accept_label: 허용 답안
        explanation: 현재성은 구체적인 계획이 이미 막혔거나 가까운 장래에 확실히 막힐 상황인지를 묻는다. 계획과 상관의 경고를 나열하는 데서 그치지 않고 실제 표현 위축 또는 확실한
          장래 제한으로 연결했는지 본다. 두 경로를 모두 쓸 필요는 없다.
    reference_sections:
    - Ⅰ. 헌법소원심판청구서 / ③ 적법요건의 구비
  - id: P-I-3
    title: ④ 집단 진정·서명 금지의 위헌성
    points: 16
    expected: 과잉금지원칙에 따라 부사관의 표현의 자유 침해를 논증. 국가기관에 대한 공동 문서 청원으로 구성한 대안도 명시된 조건에 따라 인정.
    sections:
    - title: 제한되는 기본권과 심사기준
      points: 6
      items:
      - id: P-I-3-a
        points: 2
        criterion: 군무 고충을 집단 진정·서명으로 전달하는 행위가 표현의 자유에 포함되고 군인에게도 원칙적으로 보장되나 제31조가 이를 제한함을 사안에 적용한다. 청원권 대안은 아래 허용
          답안의 조건에 따른다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 군인에게도 표현의 자유 또는 청원권이 보장된다고 설명했으나, 기록의 집단 진정·서명이 보호되는 행위라는 점과 금지조항에 의한 제한을 모두 연결하지 못했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 군인의 권리주체성, 계획한 행위가 기본권의 보호영역에 속한다는 이유, 금지조항에 의한 제한을 확인한다. 청원권 구성에서는 국방부에 문서로 보수 관련 고충의 시정을
          요구하는 행위와 그 공동서명을 연결해야 한다. 제한 설명이 최소침해 등 뒤 문단에 있어도 같은 진정행위에 관한 설명이면 함께 인정한다.
        accept: 군인도 청원권의 주체이고, 국방부에 문서로 보수 관련 고충의 시정을 요구하는 집단 진정과 그에 필요한 공동서명이 청원권의 보호를 받으며, 제31조의 금지가 이를 제한한다고
          설명하면 2점이다. 청원권이라는 명칭만 적은 것은 본문 적용 점수가 되지 않는다. 청원인이 원하는 모든 집단행위나 제출 방식이 보장된다거나 청원법이 군인복무기본법의 금지를 당연히 배제한다고
          설명한 것만으로는 이 대안을 충족하지 못한다. 정치단체 결성 관여에 관한 청원권 주장은 이 허용 범위에 포함하지 않는다.
        accept_label: 허용 답안
      - id: P-I-3-b
        points: 2
        criterion: 헌법 37조 2항에 따른 과잉금지 심사를 선택하고 목적·수단·최소침해·균형의 구조로 평가한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 과잉금지원칙을 적용한다고 적었으나, 목적의 정당성·수단의 적합성·침해의 최소성·법익의 균형성 중 하나 이상을 빠뜨리거나 다른 심사기준으로 대체했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 과잉금지의 네 판단 단계를 사용했는지 보는 항목이다. 네 개의 소제목이나 헌법 조문번호를 그대로 쓸 필요는 없다. 본문에서 목적·수단·최소침해·균형을 각각 다루면
          인정하며, 각 논증의 충실도는 해당 항목에서 평가한다.
      - id: P-I-3-c
        points: 2
        criterion: 군의 질서·통수체계·전투력·안보라는 목적의 정당성과 집단행위 제한의 수단 적합성을 구체적으로 평가한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 목적의 정당성이나 수단의 적합성을 인정·부정하는 결론만 적고, 군 질서 보호라는 목적과 집단행위 제한의 관계를 설명하지 않았다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 목적과 수단의 적합성을 인정한 뒤 최소침해 위반을 주장하는 답안을 기준으로 한다. 평화적인 진정을 금지해도 군 질서 보호에 기여하지 못하는 이유를 설명하여 수단의 적합성을
          부정한 답안도 인정한다.
        accept_label: 허용 답안
        explanation: 목적은 군의 질서·안보를 지키려는 이유이고, 수단은 집단행위를 제한하는 방법이다. 목적이 정당하다는 설명만 있어도 명시된 1점 조건에 해당한다. 만점에는 그 제한이
          목적 달성에 기여하는지에 대한 평가가 더 필요하다.
    - title: 기록을 이용한 과잉금지 논증
      points: 10
      items:
      - id: P-I-3-d
        points: 7
        criterion: 최소침해 위반을 논증한다. 핵심은 군기 문란의 구체적 위험·공익 침해가 없는 보수 개선 진정까지 일률적으로 금지한다는 점이다. 부사관의 지휘상 지위, 개별 고충절차의
          실효성 한계, 군 외부만 금지하던 구 규율에서 군 내부까지 확대한 점, 위험 있는 행위만 제한하는 대안 중 기록에 맞는 논거를 결합한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 집단 진정의 일률적 금지가 과도하다는 주장을 기록의 사실 하나와 연결했다.
          4: 군기 문란의 위험이 없는 보수 개선 요구도 금지된다는 점과, 부사관의 지위·개별 고충절차의 한계·군 내부까지 확대된 금지 중 한 가지를 설명했다.
          6: 위 일률적 금지의 문제와 서로 다른 보충 논거 두 가지를 설명했으나, 위험한 행위만 제한하는 등 덜 제한적인 방법은 제시하지 않았다.
          7: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 위험 없는 보수 개선 요구까지 금지된다는 점, 서로 다른 보충 논거 두 가지, 덜 제한적인 규율 방법을 연결하면 7점이다. 예시 논거를 모두 쓰거나 통계 수치를 그대로 인용할
          필요는 없다.
        accept_label: 만점 조건
        explanation: 중심 논거는 위험 없는 평화적 보수 개선 요구까지 전면 금지한다는 점이다. 여기에 부사관의 지위, 개별 절차의 한계, 군 내부까지 넓어진 금지라는 보충 논거를 구별하여
          읽는다. 만점에는 중심 논거와 서로 다른 보충 논거 두 가지, 덜 제한적인 방법을 연결해야 한다. 동일한 이유의 반복은 두 논거가 아니다.
      - id: P-I-3-e
        points: 3
        criterion: 군 질서·안보의 공익을 인정하되 구체적 위험 없는 고충표현을 봉쇄하는 불이익과 비교한다. 건전한 문제해결 통로와 부사관 사기에도 미치는 영향을 고려하여 균형 상실과 표현의
          자유 침해 결론을 제시한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 법익의 균형성이 없거나 표현의 자유 또는 허용된 청원권을 침해한다는 결론을 제시했다.
          2: 군 질서·안보의 공익과 부사관의 고충표현·문제해결 기회를 비교했으나, 구체적 위험 없는 표현을 금지해 얻는 이익보다 제한의 손해가 크다는 판단은 제시하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 공익은 군 질서·안보이고, 제한으로 생기는 손해는 위험 없는 고충을 함께 표현하고 해결할 기회를 잃는 것이다. 금지로 더 얻는 이익은 작지만 표현 통로를 막는 손해가
          크다는 비교가 있는지 확인한다. 공익 설명과 비교가 다른 문단에 나뉘어도 같은 집단 진정에 대한 논증이면 인정한다.
        accept: P-I-3-a의 청원권 구성에서도 같은 공익·불이익 비교와 균형 상실을 논증하면 3점이다. 결론의 기본권 명칭이 청원권이라는 이유로 감점하지 않는다.
        accept_label: 허용 답안
    reference_sections:
    - Ⅰ. 헌법소원심판청구서 / ④ 위헌이라고 해석되는 이유 / 1. 집단 진정·서명 금지와 표현의 자유
  - id: P-I-4
    title: ④ 정치단체 결성 관여 금지의 위헌성
    points: 15
    expected: 명확성 원칙 위반을 중심으로 정치적 표현의 자유 침해를 주장.
    sections:
    - title: 표현 제한과 명확성 심사
      points: 15
      items:
      - id: P-I-4-a
        points: 2
        criterion: 퇴역군인 모임 준비에 정보·의견을 전달하려는 행위가 정치적 표현의 자유의 보호영역에 속하고 정치단체 결성 관여 금지가 이를 위축시킴을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 정치적 표현의 자유를 기재했으나, 퇴역군인 모임에 정보를 제공하고 의견을 말하는 행위가 그 보호를 받는 이유는 설명하지 않았다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 보수 실태를 알려주고 의견을 말하려는 계획을 정치적 표현의 자유와 연결했는지 본다. 단체에 실제 가입했다고 가정할 필요는 없다. 보호영역의 일반론 뒤에 나오는 모임
          준비 사실이나 앞의 표현 위축 설명도 적용 대상이 같으면 함께 읽는다.
      - id: P-I-4-b
        points: 3
        criterion: 명확성은 수범자의 예측가능성과 자의적 집행 통제를 위한 기준이다. 표현 규제이자 형벌의 구성요건과 연결되므로 엄격한 명확성이 필요하다는 점을 설명한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 명확성원칙이 예측가능성과 자의적 집행 방지를 위한 것이라고 설명했다.
          2: 금지되는 행위의 예측 곤란과 자의적 집행 위험을 이 사건에 적용했으나, 표현의 위축효과와 형벌의 근거가 된다는 엄격 심사 사유 중 하나 이상을 설명하지 않았다.
          3: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 벌칙과 연결된다는 점을 엄격한 명확성 심사의 근거로 설명할 수 있다. 별도의 죄형법정주의 쟁점을 만들거나 벌칙 조항 자체의 위헌확인을 청구할 필요는 없다.
        accept_label: 채점 유의사항
        explanation: 명확성은 무엇이 금지되는지 미리 알 수 있고 집행기관이 마음대로 적용하지 못하도록 하는 기준이다. 엄격하게 심사할 이유는 불명확성 때문에 허용되는 표현까지 삼가게
          된다는 점과 형사처벌의 근거가 된다는 점이다. 실제 행위를 중단했다는 사실만 적은 것과, 표현 위축을 엄격한 심사의 이유로 설명한 것을 구별한다.
      - id: P-I-4-c
        points: 8
        criterion: “그 밖의 정치단체”와 “결성에 관여” 중 하나를 중심으로 불명확성을 사안에 적용한다. 정치단체를 중심으로 하면 생활상 이익단체의 의제가 뒤늦게 정당 당론으로 채택되면
          정치단체로 바뀔 수 있고 정당에 준하는 단체로 한정할 문언·목적·활동 기준이 부족하다는 점을, 관여를 중심으로 하면 단체 설립 주도뿐 아니라 설립 준비 단계의 단순 정보제공·의견표명까지
          포괄하는지 예측할 수 없다는 점을 의뢰인의 계획에 적용한다. 법관의 보충해석만으로 자의적 집행의 위험을 없애기 어렵다고 논증한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          2: 정치단체나 관여의 범위를 예측하기 어렵다는 주장을 기록의 구체적 사정 하나와 연결했다.
          4: 선택한 개념에 관하여 기록의 사정과 집행기관의 자의적 판단 위험을 설명했으나, 금지 범위를 한정할 객관적 기준의 부재와 법관의 보충해석 한계에 관한 설명은 없다.
          6: 기록의 사정과 자의적 판단 위험을 설명하고, 금지 범위를 한정할 객관적 기준의 부재와 법관의 보충해석 한계 중 하나를 더 설명했다.
          8: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 정치단체 또는 관여 중 하나에 관하여 평가기준을 충족하면 8점이다. 두 개념을 모두 논증할 필요는 없으며, 모두 썼다는 이유로 추가 점수를 주지 않는다. 두 개념을 함께 다룬
          답안은 전체 논증을 읽고 금지 범위의 불명확성, 기록 적용, 자의적 집행 위험과 보충해석 한계를 판단한다. 같은 취지의 사실·법리 설명을 개념별로 반복할 필요는 없다.
        accept_label: 허용 답안
        explanation: 객관적 기준의 부재는 조문에 단체나 관여의 범위를 가를 잣대가 부족하다는 설명이다. 보충해석의 한계는 조문의 다른 문언·목적 등을 함께 보아 범위를 좁혀 읽어도 불확실성이
          해결되지 않는다는 설명이다. ‘정치단체’와 ‘결성에 관여’ 중 한 개념을 골라 충분히 논증하면 된다. 법관의 보충해석이라는 용어 자체가 아니라 해석으로도 한계를 정하기 어려운 이유를
          찾는다.
      - id: P-I-4-e
        points: 2
        criterion: 명확성 위반으로 정치적 표현의 자유가 침해된다는 결론을 제시하고, 내부 전략상 제외한 과잉금지·책임과 형벌 비례·평등권·결사의 자유를 별도 주된 공격사유로 삼지 않는다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 명확성 위반에 따른 표현의 자유 침해를 주장했으나, 작성 지시에서 제외한 과잉금지·책임과 형벌의 비례·평등권·결사의 자유 중 하나를 별도 위헌 사유로 전개했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 다른 원칙을 주장하지 않는 이유를 짧게 설명한 것은 제외된 쟁점을 독립적으로 전개한 것으로 보지 않는다.
        accept_label: 채점 유의사항
        explanation: 명확성 위반과 정치적 표현의 자유 침해라는 결론을 확인한다. 집단 진정 금지에 과잉금지 심사를 적용한 것은 별개의 지정 쟁점이다. 여기서 금지하는 것은 정치단체 결성
          관여 규정에 대해 제외된 공격사유를 독립적으로 전개하는 경우다.
