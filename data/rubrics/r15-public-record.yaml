          1: 구민호를 원고로 기재하면서 교육지원청·교육장·지고원 등을 공동원고로 추가했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        explanation: 영업상 지위를 잃고 철거명령을 받은 구민호가 원고다. 교육장은 구민호를 돕고 싶다는 사정만으로 공동원고가 되는 것이 아니다. 원고 이름의 기재와 본문의 원고적격 이유는
          각각 해당 항목에서 본다.
      - id: P-II-1-b
        points: 2
        criterion: ② 피고를 강원특별자치도교육청 행정심판위원회와 강원특별자치도 고성군수로 특정한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 행정심판위원회와 고성군수 중 한 피고만 맞게 기재했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: “고성군수”로 줄여 적어도 기록에 나온 강원특별자치도 고성군수임을 알 수 있으면 인정한다. 행정심판위원회 대신 위원장 개인을 피고로 적은 것은 인정하지 않는다.
        accept_label: 허용 답안
        explanation: 재결을 한 행정심판위원회와 철거명령을 한 고성군수를 구별한다. 위원장 개인이나 제외처분을 했던 교육장을 그 대신 기재한 것은 다르게 평가한다. 고성군수가 어느 지역의
          기관인지 기록에 따라 식별되어야 한다.
      - id: P-II-1-c
        points: 4
        criterion: ③ 2025. 11. 3. 제외처분을 취소한 재결(2025강원교행심 2681)과 2025. 12. 23. 원고에 대한 만화 대여시설 철거명령을 각각 취소한다는 청구취지를
          특정한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 취소재결 또는 철거명령의 취소를 구했으나, 어느 행위인지 특정할 수 있는 일자·내용을 적지 않았다.
          2: 두 대상 중 하나를 특정하여 취소를 구했다.
          3: 취소재결과 철거명령 모두의 취소를 구했으나, 한쪽만 일자·내용으로 특정할 수 있고 다른 한쪽은 특정할 수 없다.
          4: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 일자·사건번호·내용을 종합하여 어느 재결인지 구별되면 인정한다. 모든 식별 정보를 빠짐없이 적을 필요는 없다. 원고에게 유리했던 제외처분 자체의 취소를 구한 것은 재결취소
          청구로 인정하지 않는다.
        accept_label: 허용 답안
        explanation: 원고에게 유리했던 제외처분을 되살리려면 그것을 취소한 재결을 다투어야 한다. 따라서 청구 대상은 재결과 별도 철거명령 두 개다. 일자나 사건번호를 모두 외웠는지가
          아니라 각각 어떤 행위를 취소해 달라는지 식별되는지 확인한다.
      - id: P-II-1-d
        points: 2
        criterion: ⑥ 기록의 증명서류 두 개를 식별 가능한 이름과 증거번호로 기재한다.
        scoring:
          0: 기록에 있고 주장을 뒷받침하는 증명서류를 하나도 식별하여 제시하지 못했다.
          1: 관련 서류를 하나만 식별하여 제시했다. 또는 관련 서류를 포함하되 두 개를 넘겨 기재했다. 또는 관련 서류 두 개의 이름은 식별되지만 하나 이상의 증거번호를 빠뜨리거나 중복·잘못
            기재했다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: 재결서·철거명령서 외에도 지역교육환경보호위원회 회의록, 유해인식도 연구, 정구력 진술서 등 기록에 있고 주장 입증에 관련된 서류 두 개의 조합을 인정한다.
        accept_label: 허용 답안
        explanation: 서류의 내용·이름을 맞게 고른 것과 소장의 증거번호 형식을 갖춘 것을 구별한다. 두 서류가 정확히 식별되어도 갑 제1호증 등 증거번호가 없으면 1점이다. 단순 목록번호
          1·2만 적은 것은 증거번호 기재로 보지 않는다.
      - id: P-II-1-e
        points: 2
        criterion: ⑦ 두 취소 청구를 함께 제기할 수 있는 마지막 날인 2026. 2. 5.를 작성일·제출일로 기재한다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 두 청구를 함께 제기할 수 있는 기간 안의 날짜를 적었으나, 마지막 날인 2026. 2. 5.는 아니다.
          2: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
        accept: P-II-2-c에서 기산사실·적용기간·공동 제출 종기를 정하는 법리는 맞지만 날짜의 단순 계산오류로 감점했고, 그 계산값을 작성일에 일관되게 옮겼다면 이 항목은 2점으로 인정한다.
          기산사실이나 적용기간을 잘못 정한 경우, 두 기간 중 늦은 날을 택한 경우, 날짜를 누락하거나 본문 계산과 모순되게 적은 경우에는 이 예외를 적용하지 않는다.
        accept_label: 중복 감점 방지
        explanation: 문제는 적법한 날짜 아무 날이 아니라 두 청구를 함께 제출할 수 있는 마지막 날을 요구한다. 본문에서 이미 감점한 단순 일수 계산을 그대로 옮긴 경우와, 송달일 자체를
          잘못 고른 경우를 구별하여 아래 중복 감점 방지 규칙을 적용한다.
      - id: P-II-1-f
        points: 1
        criterion: ⑧ 관할을 춘천지방법원 강릉지원으로 기재한다. 기록의 행정사건 관할표에 따른다.
        scoring:
          0: 만점·부분점수·허용 답안의 조건을 어느 것도 충족하지 못함.
          1: 평가기준에 적힌 내용과 필요한 사실 적용을 모두 충족함. 명시된 허용 답안도 같은 점수로 인정함.
